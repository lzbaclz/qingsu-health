  safety_card:
    collapsed: 出现这些情况，立刻就医 ›
    items:
    - 尿不出来，或者要很用力才尿得出来
    - 憋不住尿或大便，或者尿了、拉了自己都没感觉
    - 两腿之间、肛门周围发麻发木，上完厕所擦的时候感觉和平时不一样
    - 两条腿突然都没劲，站不稳、走不了路
    - 发高烧、发冷打寒战，或者人一下子没了精神
    - 从来没有过的剧痛突然出现，或者同时胸口痛、喘不上气、肚子痛、出冷汗、要晕倒
    - 车祸、从高处摔下、被重物砸到以后腰背痛
    - → 去附近有急诊的综合医院；走不了路或没人送，就打 120。不用先问门诊。
    save_hint: 长按存到手机相册，或者截个屏；家里人也存一份。拿不准算不算的时候，宁可去医院看一次。（模拟临床稿）
