    label: 新情况的描述
    record_label: 新情况描述   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: text
    category: followup

questions:
  - {id: k_redness,   fact_key: redness_warmth,     type: yes_no, priority: 10, tier: 1, text: 膝盖有没有发红、摸着发热？}
  - {id: k_fever,     fact_key: fever,              type: yes_no, priority: 11, tier: 1, text: 这几天有没有发烧或发冷寒战？}
  - {id: k_calf,      fact_key: calf_swelling_pain, type: yes_no, priority: 12, tier: 1, text: 小腿有没有突然肿胀、发热或疼痛？}
  - {id: k_neuro,     fact_key: neuro_vascular,     type: yes_no, priority: 13, tier: 1, text: 膝盖以下有没有发凉、发白，或明显麻木、抬不起脚？}
  - {id: k_trauma,    fact_key: trauma_recent,      type: yes_no, priority: 14, tier: 1, text: 最近有没有扭伤、撞到或摔倒？}
  - {id: k_weight,    fact_key: weight_bearing,     type: single_choice, priority: 15, tier: 1, text: 现在走路怎么样？}
  - {id: k_swelling,  fact_key: swelling,           type: yes_no, priority: 20, text: 膝盖有没有肿？}
  - {id: k_swell_onset, fact_key: swelling_onset,   type: single_choice, priority: 21, when: facts.swelling.present and facts.trauma_recent.present, text: 受伤后多久开始肿的？}
  - {id: k_locking,   fact_key: locking,            type: yes_no, priority: 22, text: 膝盖有没有突然卡住、伸不直的时候？}
  - {id: k_onset_timing, fact_key: onset_timing,    type: single_choice, priority: 23, text: 这一次膝盖不舒服是从多久前开始的？}
  - {id: k_onset_mode, fact_key: onset_mode,        type: single_choice, priority: 24, text: 是突然出现的，还是慢慢出现的？}
  - {id: k_trigger,   fact_key: trigger,            type: single_choice, priority: 25, text: 出现之前有没有明显诱因？}
  - {id: k_side,      fact_key: pain_side,          type: single_choice, priority: 26, text: 主要是哪一侧的膝盖？}
  - {id: k_severity,  fact_key: severity_now,       type: scale, priority: 27, text: 现在疼到什么程度？0 是完全不痛，10 是无法忍受。}
  - {id: k_course,    fact_key: course,             type: single_choice, priority: 28, text: 最近几天整体是好转、加重，还是差不多？}
  - {id: k_aggr,      fact_key: aggravating,        type: multi_choice, priority: 29, text: 什么情况下更明显？可以多选。}
  - {id: k_giving,    fact_key: giving_way,         type: yes_no, priority: 30, text: 有没有打软腿、突然使不上劲的时候？}
  - {id: k_function,  fact_key: function_impact,    type: single_choice, priority: 31, text: 对日常活动影响有多大？}
  - {id: k_multi,     fact_key: multiple_joints,    type: yes_no, priority: 40, text: 除了膝盖，还有别的关节同时疼吗？}
  - {id: k_night,     fact_key: night_pain,         type: yes_no, priority: 41, text: 有没有夜里疼醒的情况？}
  - {id: k_wt_loss,   fact_key: weight_loss,        type: yes_no, priority: 42, text: 最近几个月体重有没有不明原因地明显下降？}
  - {id: k_cancer,    fact_key: cancer_history,     type: yes_no, priority: 43, text: 以前有没有得过肿瘤？}
  - {id: k_prior,     fact_key: prior_episodes,     type: yes_no, priority: 44, text: 以前有没有出现过类似情况？}
  - {id: k_meds,      fact_key: current_medication, type: text, priority: 45, text: 目前有没有在用什么药或贴剂？（只做记录，这里不提供用药建议）}
  - {id: k_concern,   fact_key: patient_concern,    type: text, priority: 50, text: 你最担心的是什么？}

red_flags:
  - id: kf_septic_joint
    label: 膝关节红肿热伴发热（疑似关节感染需排除）
    when: facts.redness_warmth.present and facts.fever.present
    severity: urgent
    action: immediate_notice_and_task
    on_trigger: stop_questioning
    patient_message: 你提到膝盖红肿发热并伴有发烧。这类情况需要当天尽快评估，请不要等待线上回复，立即前往就近医院急诊。（AI 草案，待临床审核）
  - id: kf_dvt
    label: 小腿肿胀发热疼痛
    when: facts.calf_swelling_pain.present
    severity: urgent
    action: immediate_notice_and_task
    on_trigger: stop_questioning
    patient_message: 你提到小腿肿胀、发热或疼痛。请不要等待线上回复，尽快前往医院急诊；如伴胸痛、气短，请立即拨打 120。（AI 草案，待临床审核）
  - id: kf_neurovascular
    label: 膝盖以下发凉发白或明显麻木无力
    when: facts.neuro_vascular.present
    severity: urgent
    action: immediate_notice_and_task
    on_trigger: stop_questioning
    patient_message: 你提到膝盖以下发凉、发白或明显麻木无力。请不要等待线上回复，立即前往就近医院急诊。（AI 草案，待临床审核）
  - id: kf_cannot_bear_weight
    label: 外伤后走不了 4 步
    when: facts.trauma_recent.present and facts.weight_bearing.value == 'cannot_4_steps'
    severity: same_day
    action: immediate_notice_and_task
    patient_message: 你提到受伤后走不了几步。请今天内到医院急诊或骨科评估，先不要勉强走路。（AI 草案，待临床审核）
  - id: kf_fever
    label: 伴发热
    when: facts.fever.present
    severity: same_day
    action: immediate_notice_and_task
    patient_message: 你提到有发热。请今天内联系门诊说明情况；如膝盖同时红肿发热，请直接前往急诊。（AI 草案，待临床审核）
  - id: kf_rapid_swelling
    label: 外伤后 2 小时内迅速肿胀
    when: facts.trauma_recent.present and facts.swelling_onset.value == 'within_2h'
    severity: same_day
    action: task_only
    patient_message: "（仅供医生复核）"
  - id: kf_locked
    label: 交锁（卡住伸不直）
    when: facts.locking.present
    severity: same_day
    action: task_only
    patient_message: "（仅供医生复核）"
  - id: kf_tumor_features
    label: 夜间痛 / 体重下降 / 肿瘤史
    when: facts.night_pain.present or facts.weight_loss.present or facts.cancer_history.present
    severity: routine
    action: task_only
    patient_message: "（仅供医生复核）"
  - id: kf_inflammatory
    label: 多关节受累
    when: facts.multiple_joints.present
    severity: routine
    action: task_only
    patient_message: "（仅供医生复核）"
  - id: kf_uncertain_red_flag
    label: 关键红旗表达不确定
    when: facts.redness_warmth.uncertain or facts.calf_swelling_pain.uncertain or facts.neuro_vascular.uncertain
    severity: same_day
    action: task_only
    patient_message: "（仅供医生复核：患者对关键问题表达不确定，需人工确认）"

scope_guard:
  forbidden_patterns:
    - "诊断为|确诊|你得了|你患有"
    - "半月板损伤|前交叉韧带|十字韧带断裂|骨关节炎|髌骨软化|痛风|化脓性关节炎|深静脉血栓|骨折了"
    - "服用|口服|每日\\d+次|每天\\d+次|\\d+\\s*(mg|毫克)|布洛芬|对乙酰氨基酚|双氯芬酸|塞来昔布|氨基葡萄糖"
    - "建议你(吃|用|贴|打)|开药|处方|打封闭"

followup:
  default_interval_days: 7
  change_facts: [severity_now, course, pain_regions, swelling, locking, giving_way, weight_bearing, function_impact, redness_warmth, calf_swelling_pain]
  questions:
    - {id: kfu_overall, fact_key: fu_change_overall, type: single_choice, priority: 10, stage: follow_up, text: 和上次相比，整体感觉怎么样？}
    - {id: kfu_severity, fact_key: severity_now, type: scale, priority: 11, stage: follow_up, text: 现在疼到什么程度？}
    - {id: kfu_new, fact_key: fu_new_symptom, type: yes_no, priority: 12, stage: follow_up, text: 有没有出现上次没有的新情况？}
    - {id: kfu_new_desc, fact_key: fu_new_symptom_desc, type: text, priority: 13, stage: follow_up, when: facts.fu_new_symptom.present, text: 请说说新出现的情况。}
    - {id: kfu_redness, fact_key: redness_warmth, type: yes_no, priority: 14, tier: 1, stage: follow_up, text: 膝盖有没有发红、摸着发热？}
    - {id: kfu_calf, fact_key: calf_swelling_pain, type: yes_no, priority: 15, tier: 1, stage: follow_up, text: 小腿有没有突然肿胀、发热或疼痛？}
    - {id: kfu_swelling, fact_key: swelling, type: yes_no, priority: 16, stage: follow_up, text: 膝盖有没有肿？}
    - {id: kfu_weight, fact_key: weight_bearing, type: single_choice, priority: 17, stage: follow_up, text: 现在走路怎么样？}
    - {id: kfu_function, fact_key: function_impact, type: single_choice, priority: 18, stage: follow_up, text: 对日常活动影响有多大？}

summary:
  chief_complaint_label: 膝部不适
  key_facts_order: [onset_timing, onset_mode, trigger, pain_side, pain_regions, trauma_recent, weight_bearing, swelling, swelling_onset, redness_warmth, fever, calf_swelling_pain, neuro_vascular, locking, giving_way, character, severity_now, course, aggravating, function_impact, multiple_joints, night_pain, weight_loss, cancer_history, prior_episodes, current_medication, patient_concern]
  narrative_enabled: true

evaluation:
  critical_facts: [pain_side, onset_timing, trauma_recent, weight_bearing, redness_warmth, fever, calf_swelling_pain, neuro_vascular, severity_now]
  error_taxonomy:
    - {code: E1_critical_omission, label: 关键事实遗漏, severity: critical}
    - {code: E2_fabrication, label: 编造患者没说过的事实, severity: critical}
    - {code: E3_unknown_as_denied, label: 未问/未答被写成否认, severity: critical}
    - {code: E4_missed_escalation, label: 应升级未升级, severity: critical}
    - {code: E6_out_of_scope_advice, label: 越权给出诊断/用药建议, severity: critical}
