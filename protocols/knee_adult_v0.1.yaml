    record_label: 肿瘤病史   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: history
    lexicon: {present_terms: [肿瘤, 癌, 化疗], denied_terms: [没有肿瘤]}
  - key: multiple_joints
    label: 是否多个关节同时疼
    record_label: 多关节疼痛   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: associated
    lexicon: {present_terms: [好几个关节, 手指关节也, 别的关节也], denied_terms: [只有膝盖]}
  - key: character
    label: 疼痛的感觉
    record_label: 疼痛性质   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: multi_enum
    category: character
    options:
      - {value: aching, label: 酸痛, synonyms: [酸, 酸痛]}
      - {value: sharp,  label: 刺痛, synonyms: [刺痛, 针扎]}
      - {value: stiff,  label: 僵硬, synonyms: [僵, 发僵]}
  - key: severity_now
    label: 现在的疼痛程度（0 完全不痛 – 10 无法忍受）
    record_label: 目前疼痛评分（0–10）   # 写进病历初稿时用的短标签（工程拟，医生可改）
