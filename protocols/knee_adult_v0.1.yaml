    category: timing
    required: true
    options:
      - {value: improving, label: 在好转, synonyms: [好转, 轻了, 好一些]}
      - {value: stable,    label: 差不多, synonyms: [差不多, 没变化]}
      - {value: worsening, label: 在加重, synonyms: [加重, 越来越疼, 更疼]}
  - key: aggravating
    label: 什么情况更明显
    record_label: 加重因素   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: multi_enum
    category: aggravating
    options:
      - {value: stairs,   label: 上下楼, synonyms: [上楼, 下楼, 上下楼]}
      - {value: squat,    label: 下蹲,   synonyms: [蹲下, 下蹲]}
      - {value: walking,  label: 走路,   synonyms: [走路, 走久]}
      - {value: standing_up, label: 起立, synonyms: [站起来, 起身]}
