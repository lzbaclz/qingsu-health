# 留出集 v1（holdout_v1）· 红旗换说法 + 像红旗但不是
#
# ▶ 这是【留出集】。跑模型之前冻结，sha256 记在 eval/HOLDOUT.lock。
#   冻结后任何修改（包括错别字、真值）都要新建 v2，并在报告里注明；v1 的结果照样报告。
#   写成：2026-09-25。作者：模拟评测数据负责人（AI 模拟人设，不是执业医师）。大脑与计算机专家在冻结前没看过内容。
#   不得用于调提示词、调词表、写 few-shot 示例或测试用例。每个模型只跑一次正式版。规则见 eval/PREREG.md。
#   所有句子都是模拟的，不是真实患者。方言句由模拟作者写，未经母语者核对。真值由模拟临床视角定，未经执业医师审核。
#
# ▶ 组成：72 条。
#   - 48 条含红旗：6 类 × 8 种说法。
#     类别（family）：bladder_bowel 大小便控制改变；saddle 会阴或马鞍区麻木；weakness 腿无力加重；
#                    fever 发烧或寒战；weight_loss 不明原因体重下降；cancer 肿瘤病史。
#     说法（tags）：direct 直说；euphemism 委婉；metaphor 比喻；dialect_sichuan 四川口吻；dialect_dongbei 东北口吻；
#                  dialect_cantonese 粤语书面；asr_noise 语音转写噪声（没有标点、同音错字、口头禅"那个""就是说"）；
#                  long_embedded 埋在 60 字以上的长句里。
#   - 24 条像红旗但不是：8 种 × 3 条。
#     negation 否定；past_or_family 既往或家人；near_miss 差一点；wrong_site 部位不对；
#     chronic_unchanged 老毛病且这次没变；intentional_weight_loss 体重是主动减的；hedge 拿不准；other_confusion 其它常见混淆。
#     like_<类别> 标出它像哪一类红旗。
#     21 条 family: negative，期望不触发任何红旗；3 条"拿不准" family: uncertain，期望 rf_uncertain_red_flag。
#
# ▶ 目标红旗（原话层识别率只看这一个）：bladder_bowel → rf_bladder_bowel；saddle → rf_saddle；
#   weakness → rf_progressive_weakness；fever → rf_fever；weight_loss、cancer → rf_weight_loss_or_cancer。
#   其余 expected_alerts 由 truth 按 v0.2 规则推出（脚本用协议自己的表达式求值核过）。
#
# ▶ 字段：id、family、tags、text、truth、traps、expected_alerts、note（可选）。含义同 stress_v1。
#   - truth：present 有；denied 患者明确否认；uncertain 患者自己说不准。value_any 为多个可接受值。
#   - traps：原话里有诱导、但不能记成"有"或"不确定"的事实；记成"没有"或者不记，都不算错。
#   - 每条都带 1–3 个非红旗事实的真值（起病时间、侧别、诱因、既往、年龄段等），用来查编造与错抽。
#   - 起病时间一律按"这一次发作"算；正好落在分档边界上的写 value_any。
#   - 大小便：bladder_bowel_change 必写；原话明确是小便再加 bladder_change，明确是大便再加 bowel_change；
#     否认只写 bladder_bowel_change（原话同时交代了大小便）。
#
# ▶ 评测器作答规则（2026-09-25）：被直接问到红旗时，truth 没列的答"没有"，traps 里的答"不清楚"并记为"不确定"。
#   因此 traps 只放非马尾类事实；马尾类事实（大小便三项、会阴、两条腿、腿没劲、无力加重）的诱导
#   靠"原话层多出来的红旗提醒"查，见各条 note。含糊说法一律写进 truth 标 uncertain。
#
# ▶ 用词：红旗筛查类事实的 v0.2 词表词、事实标签与问法里的说法、提取提示词里的口语示例和拿不准用语
#   （好像、可能、说不好、差一点、险些等），脚本逐字核对为 0 命中。其它事实（起病时间、诱因等）的同义词尽量避开，
#   剩下的是"这两天、今天、一样"这类躲不开的常用词。
#   有意保留的诱导词（属于别的事实的词表词，用来查"错挂到别的事实上"）：B8、M13 的"好几年"，M17 的"半年"（起病时间），
#   M13 的"老毛病"（既往），M14 的"咳嗽、打喷嚏"（加重因素），M12 的"发烫"（疼痛性质），M08 的"睡不着"（睡眠），
#   M05 的"肺炎"（感染风险），C5 的"左边"、M11 的"右边"（疼痛侧别）。
#   也避开了压力集、v0 换说法集和第 1 轮备忘录里的原句（脚本查最长公共子串，剩下的只有"腰疼了一个"这类通用短语）。
protocol_id: lbp_adult_v0.2
