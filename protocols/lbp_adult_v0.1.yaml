# =====================================================================
# 体迹 AI · 临床协议：成年腰背痛 · 就诊前采集 + 诊后随访（示范版 v0.1）
# ---------------------------------------------------------------------
# 状态：draft —— 本文件由工程团队按公开的常见问诊结构起草，作为**占位示例**，
#       每一条 clinical_review_required: true 的内容都必须由临床队友审核、
#       修改或删除后，才能用于真实用户。切勿把本文件当作医学建议。
# 修改方式：直接编辑本 YAML；保存后运行 `make protocol-check` 或调用
#       POST /api/protocols/validate 检查格式是否合法。
# =====================================================================
protocol_id: lbp_adult_v0.1
version: "0.1.0"
status: draft
title: 成年腰背痛 · 就诊前症状采集与诊后随访
specialty: 康复科 / 疼痛科 / 骨科门诊（待临床队友确认）
language: zh-CN

owners:
  clinical_lead: "待填写：临床队友姓名（临床产品负责人）"
  clinical_reviewer: "待填写：第二位独立临床复核者"
  engineering: "李子清"

review:
  last_reviewed: null
  next_review: null
  sources:
    - "待临床队友填写：本协议参考的指南/教材/科室流程及版本"

# ---------------------------------------------------------------------
# 一、适用范围（医生交付物 #1）
# ---------------------------------------------------------------------
scope:
  setting: "小型康复/全科/疼痛门诊，患者在就诊前自行填写；诊后由门诊邀请进入随访"
  service_hours: "工作日 9:00–17:30（示例，按门诊实际填写）"
  inclusion:
    - "18 岁及以上"
    - "本次主诉为腰背部疼痛或不适"
    - "已由门诊邀请使用（就诊前）或已经医生评估并纳入随访（诊后）"
  exclusion:
    - "未满 18 岁"
    - "孕期（开始页已先行排除，是否纳入待临床确认）"
    - "近期重大外伤后首次就诊（待临床确认）"
    - "由他人代填且本人无法确认内容"
  service_notice: >-
    这个工具用来帮助你在见医生之前把不舒服的情况说清楚，并把你的描述整理给医生核对。
    它不做诊断，不提供治疗或用药建议。你填写的内容会由门诊医生查看。
    非工作时间提交的内容，医生会在下一个工作日查看。
  emergency_notice: >-
    如果出现以下任一情况，请不要等待线上回复，立即联系门诊或前往就近急诊：
    大小便控制出现问题、会阴/肛门周围发麻、双腿突然无力、伴高热、剧烈外伤后疼痛。
  out_of_scope_message: >-
    根据你的回答，这个工具目前不适用于你的情况。请直接联系门诊预约或说明情况。
  contact_label: 演示门诊
  contact_phone: "0755-00000000"   # 演示占位号码（不可拨通）；真实部署由门诊填写。为空时紧急终止页只显示急救电话
  eligibility:                     # 开始页逐条确认；选"不对"不进入采集（第二轮评审：临床审核前先挡住未成年人与孕期）
    - id: adult
      text: 我已年满 18 岁
      if_not: 这个工具目前只适用于 18 岁及以上的成年人。请由家长直接联系门诊；如有紧急情况请拨打 120。
    - id: not_pregnant
      text: 我目前没有怀孕
      no_label: 不对，正在怀孕或可能怀孕
      if_not: 孕期的腰背痛需要医生直接评估，这个工具暂不适用。请直接联系门诊；如有紧急情况请拨打 120。
  emergency_phone: "120"

max_questions: 16

# ---------------------------------------------------------------------
# 二、身体地图与事实的对应
# ---------------------------------------------------------------------
body_map:
  regions_fact_key: pain_regions
  side_fact_key: pain_side
  radiation_fact_key: radiation_regions
  regions_of_interest:
    - lower_back_left
    - lower_back_center
    - lower_back_right
    - sacrum
    - buttock_left
    - buttock_right
    - thigh_left_back
    - thigh_right_back
    - knee_left_back
    - knee_right_back
    - calf_left
    - calf_right
    - heel_left
    - heel_right

# ---------------------------------------------------------------------
# 三、事实清单（医生交付物 #3：事实表达规范）
#   type: bool | enum | multi_enum | number | scale | text | body_regions
#   required: 摘要必须明确其状态（含"未知"）；critical: 评测关键事实
#   lexicon / synonyms: 供离线抽取与测试用的口语词表（临床可补充）
# ---------------------------------------------------------------------
facts:
  # ---- 位置 ----
  - key: pain_regions
    label: 疼痛部位
    record_label: 疼痛部位   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: body_regions
    category: location
    required: true
    critical: true
    options:   # 这里只列文字抽取需要的同义词；完整区域见 body_regions.yaml
      - {value: lower_back_left,   label: 左腰,       synonyms: [左边腰, 左侧腰, 腰左边, 腰左侧, 左腰]}
      - {value: lower_back_right,  label: 右腰,       synonyms: [右边腰, 右侧腰, 腰右边, 腰右侧, 右腰]}
      - {value: lower_back_center, label: 腰部正中,   synonyms: [腰正中, 腰中间, 整个腰, 腰部正中]}
      - {value: buttock_left,      label: 左臀,       synonyms: [左边屁股, 左臀, 左侧屁股]}
      - {value: buttock_right,     label: 右臀,       synonyms: [右边屁股, 右臀, 右侧屁股]}
      - {value: thigh_left_back,   label: 左大腿（后）, synonyms: [左大腿后面, 左腿后面]}
      - {value: thigh_right_back,  label: 右大腿（后）, synonyms: [右大腿后面, 右腿后面]}
      - {value: calf_left,         label: 左小腿（后）, synonyms: [左小腿]}
      - {value: calf_right,        label: 右小腿（后）, synonyms: [右小腿]}
    notes: "由身体图标记为主；文字中提到的部位作为补充证据"

  - key: pain_side
    label: 疼痛主要在哪一侧
    record_label: 侧别   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: location
    required: true
    critical: true
    options:
      - {value: left,   label: 左侧,   synonyms: [左边, 左侧, 左面]}
      - {value: right,  label: 右侧,   synonyms: [右边, 右侧, 右面]}
      - {value: both,   label: 两侧,   synonyms: [两边, 两侧, 双侧, 左右都]}
      - {value: center, label: 正中,   synonyms: [正中间, 中间, 正中]}
    notes: "由身体图自动推导；与文字描述不一致时触发澄清，而不是自动取其一"

  - key: radiation_present
    label: 疼痛是否向臀部或腿部放射
    record_label: 放射痛   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: radiation
    required: true
    critical: true
    lexicon:
      present_terms: [放射, 串到, 窜到, 蹿到, 串过去, 串过来, 窜过去, 往下串, 往腿, 往屁股, 牵到, 传到腿, 到腿, 到脚, 腿也疼, 腿也痛, 腿好像也, 屁股也, 屁股好像也]
      denied_terms: [不放射, 没有放射, 只在腰, 腿不疼, 腿不痛]

  - key: radiation_regions
    label: 放射到的部位
    record_label: 放射部位   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: body_regions
    category: radiation
    options:
      - {value: buttock_left,     label: 左臀,        synonyms: [左边屁股]}
      - {value: buttock_right,    label: 右臀,        synonyms: [右边屁股]}
      - {value: thigh_left_back,  label: 左大腿（后）, synonyms: [左大腿后]}
      - {value: thigh_right_back, label: 右大腿（后）, synonyms: [右大腿后]}
      - {value: calf_left,        label: 左小腿（后）, synonyms: [左小腿后]}
      - {value: calf_right,       label: 右小腿（后）, synonyms: [右小腿后]}
      - {value: heel_left,        label: 左足跟,      synonyms: [左脚跟]}
      - {value: heel_right,       label: 右足跟,      synonyms: [右脚跟]}

  # ---- 起病与病程 ----
  - key: onset_timing
    label: 这次不舒服开始多久了
    record_label: 病程   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: onset
    required: true
    critical: true
    lexicon:
      context_terms: [痛, 疼, 酸, 不舒服, 难受, 僵, 腰, 背]   # 只在提到腰背不适的句子里抽取时间词
    options:
      - {value: within_3_days,  label: 3 天以内,      synonyms: [今天, 昨天, 前天, 前两天, 这两天, 刚刚, 一两天]}
      - {value: days_4_to_14,   label: 4 天到 2 周,   synonyms: [这几天, 一周, 一个星期, 十来天, 几天了]}
      - {value: weeks_2_to_6,   label: 2 到 6 周,     synonyms: [两三周, 三四周, 一个月, 一个多月, 个把月, 月余]}
      - {value: weeks_6_to_12,  label: 6 到 12 周,    synonyms: [两个月, 两三个月, 三个月]}
      - {value: over_12_weeks,  label: 超过 3 个月,   synonyms: [半年, 一年, 好几年, 很久了, 老毛病, 常年]}

  - key: onset_mode
    label: 起病方式
    record_label: 起病方式   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: onset
    required: true
    options:
      - {value: sudden,  label: 突然出现, synonyms: [突然, 一下子, 闪到, 闪了, 扭了]}
      - {value: gradual, label: 慢慢出现, synonyms: [慢慢, 逐渐, 不知不觉, 越来越]}

  - key: trigger
    label: 出现前有没有明显诱因
    record_label: 诱因   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: onset
    required: true
    options:
      - {value: lifting,          label: 搬抬重物,   synonyms: [搬东西, 搬重物, 提重物, 抬东西, 搬家, 抱孩子]}
      - {value: fall_or_trauma,   label: 摔倒/外伤,  synonyms: [摔了, 摔倒, 跌倒, 撞到, 外伤, 车祸]}
      - {value: prolonged_sitting, label: 久坐/久站, synonyms: [坐了很久, 久坐, 坐太久, 站了一天, 久站]}
      - {value: exercise,         label: 运动后,     synonyms: [打球, 跑步, 健身, 运动后, 锻炼后]}
      - {value: none_known,       label: 没有明显诱因, synonyms: [没什么原因, 不知道怎么, 莫名其妙, 没有诱因]}

  - key: course
    label: 最近的变化趋势
    record_label: 近期趋势   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: timing
    required: true
    options:
      - {value: improving,   label: 在好转,   synonyms: [好转, 减轻, 轻了, 好一些, 好多了]}
      - {value: stable,      label: 差不多没变, synonyms: [差不多, 一样, 没变化, 老样子]}
      - {value: worsening,   label: 在加重,   synonyms: [加重, 更疼, 更痛, 越来越疼, 越来越痛, 严重了]}
      - {value: fluctuating, label: 时好时坏, synonyms: [时好时坏, 反反复复, 反复]}

  # ---- 性质与程度 ----
  - key: character
    label: 疼痛的感觉
    record_label: 疼痛性质   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: multi_enum
    category: character
    options:
      - {value: aching,  label: 酸胀/酸痛, synonyms: [酸, 酸胀, 酸痛, 发酸]}
      - {value: sharp,   label: 刺痛/锐痛, synonyms: [刺痛, 针扎, 锐痛, 刀割]}
      - {value: dull,    label: 钝痛/闷痛, synonyms: [钝痛, 闷痛, 闷闷的]}
      - {value: burning, label: 烧灼感,    synonyms: [烧灼, 火烧, 发烫]}
      - {value: stiff,   label: 僵硬,      synonyms: [僵硬, 发僵, 僵, 转不动, 弯不下]}

  - key: severity_now
    label: 现在的疼痛程度（0 完全不痛 – 10 无法忍受）
    record_label: 目前疼痛评分（0–10）   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: scale
    category: severity
    required: true
    critical: true
    min: 0
    max: 10

  - key: aggravating
    label: 什么情况会加重
    record_label: 加重因素   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: multi_enum
    category: aggravating
    options:
      - {value: sitting,  label: 坐久,      synonyms: [坐久, 久坐, 坐时间长, 坐一会儿就]}
      - {value: standing, label: 站久,      synonyms: [站久, 久站, 站时间长]}
      - {value: bending,  label: 弯腰,      synonyms: [弯腰, 弯下去, 系鞋带]}
      - {value: walking,  label: 走路,      synonyms: [走路, 走久, 走远]}
      - {value: coughing, label: 咳嗽/打喷嚏, synonyms: [咳嗽, 打喷嚏, 用力]}
      - {value: night,    label: 夜间,      synonyms: [夜里, 晚上更, 夜间, 半夜]}
      - {value: morning,  label: 早晨起床时, synonyms: [早上起来, 起床时, 早晨]}

  - key: relieving
    label: 什么情况会缓解
    record_label: 缓解因素   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: multi_enum
    category: relieving
    options:
      - {value: rest,     label: 休息/躺下, synonyms: [躺着, 躺下, 休息一下, 睡一觉]}
      - {value: activity, label: 活动一下,   synonyms: [走走, 活动活动, 动一动]}
      - {value: heat,     label: 热敷,      synonyms: [热敷, 暖宝宝, 热水袋]}
      - {value: position, label: 换姿势,    synonyms: [换个姿势, 换姿势]}
      - {value: medication, label: 用药后, synonyms: [吃药后, 吃了药, 贴膏药后]}
      - {value: none,     label: 没什么能缓解, synonyms: [怎么都不行, 没什么用, 都不缓解]}

  # ---- 神经相关表现（临床必须审核）----
  - key: leg_numbness
    label: 腿或脚是否发麻
    record_label: 下肢麻木   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: associated
    required: true
    critical: true
    lexicon:
      present_terms: [麻木, 发麻, 麻]
      denied_terms: [不麻, 没有麻, 没麻, 不发麻, 没有腿麻, 没有脚麻, 腿不麻, 脚不麻]
      context_terms: [腿, 脚]        # 只在提到腿/脚的短句里抽取，避免"会阴发麻"被当作腿麻

  - key: leg_weakness
    label: 腿是否无力
    record_label: 下肢无力   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: associated
    required: true
    critical: true
    lexicon:
      present_terms: [没劲, 无力, 使不上劲, 腿软, 抬不起来, 发软]
      denied_terms: [有劲, 不无力, 腿有力, 不软, 没软, 不发软, 没有无力, 不没劲]

