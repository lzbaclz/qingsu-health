    required: true
    critical: true
    lexicon: {present_terms: [发烧, 发热, 寒战, 打冷战, 体温高], denied_terms: [没发烧, 不发烧, 没有发烧]}
  - key: locking
    label: 是否卡住伸不直（交锁）
    record_label: 交锁   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: red_flag
    lexicon: {present_terms: [卡住, 伸不直, 锁住, 卡一下], denied_terms: [不卡, 没卡住]}
  - key: giving_way
    label: 是否打软腿
    record_label: 打软腿   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
