clarifications:
- fact_key: pain_side
  text: 关于疼痛在哪一侧，你的{first_source}是「{first}」，{second_source}提到「{second}」。现在的情况是？
  options:
  - label: 两侧都有
    resolve: both
  - label: 位置变了，现在主要是「{second}」
    resolve: changed_to_second
  - label: 之前点错/说错了，应该是「{second}」
    resolve: keep_second
  - label: 后面说错了，应该是「{first}」
    resolve: keep_first
  - label: 不确定
    resolve: unknown
- fact_key: onset_timing
  text: 关于这次不舒服开始的时间，你的{first_source}是「{first}」，{second_source}提到「{second}」。如果是老毛病，请按这一次发作算。现在应以哪个为准？
  options:
  - label: 这一次是「{first}」
    resolve: keep_first
  - label: 这一次是「{second}」
    resolve: keep_second
  - label: 不确定
    resolve: unknown
red_flags:
- id: rf_bladder_bowel
  label: 排尿/排便新变化
  when: facts.bladder_change.present or facts.bladder_bowel_change.present or facts.bowel_change.present
  severity: urgent
  action: immediate_notice_and_task
  on_trigger: stop_questioning
  task_kind: red_flag_review
  patient_message: 你提到排尿或排便出现了新变化。这可能是需要当天紧急处理的情况，请不要等待线上回复：立即前往就近医院急诊，告诉医生你有腰痛并且出现了这个变化。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_saddle
  label: 会阴/肛周/大腿内侧感觉异常
  when: facts.saddle_numbness.present
  severity: urgent
  action: immediate_notice_and_task
  on_trigger: stop_questioning
  task_kind: red_flag_review
  patient_message: 你提到会阴部或肛门周围感觉异常。这可能是需要当天紧急处理的情况，请不要等待线上回复：立即前往就近医院急诊，告诉医生你有腰痛并且出现了这个变化。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_ces_sexual
  label: 性功能新变化
  when: facts.sexual_function_change.present
  severity: urgent
  action: immediate_notice_and_task
  on_trigger: stop_questioning
  task_kind: red_flag_review
  patient_message: 你提到性功能出现了新变化，与腰痛同时出现时需要尽快评估。请立即联系门诊或前往急诊。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_ces_bilateral
  label: 双腿同时症状伴其他马尾症状
  when: facts.bilateral_leg_symptoms.present and (facts.bladder_change.present or facts.bowel_change.present or facts.saddle_numbness.present or facts.sexual_function_change.present or facts.weakness_progressive.present)
  severity: urgent
  action: immediate_notice_and_task
  on_trigger: stop_questioning
  task_kind: red_flag_review
  patient_message: 两条腿同时出现症状并伴有上述变化，需要当天紧急评估。请立即前往急诊。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_bilateral_only
  label: 双腿同时症状
  when: facts.bilateral_leg_symptoms.present
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到两条腿同时有症状。请今天内联系门诊，医生会尽快安排评估。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_progressive_weakness
  label: 腿部无力且在加重
  when: facts.weakness_progressive.present
  severity: urgent
  action: immediate_notice_and_task
  on_trigger: stop_questioning
  task_kind: red_flag_review
  patient_message: 你提到腿没劲并且在加重。进行性加重的无力需要尽快当面评估，请今天内前往急诊或联系门诊。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_gait
  label: 步态障碍
  when: facts.gait_disturbance.present
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到走路不稳。请今天内联系门诊。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_fever
  label: 发热/寒战
  when: facts.fever.present
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到有发热。腰痛伴发热需要尽快评估，请今天内联系门诊；如高热不退或伴寒战，请直接急诊。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_infection_risk_with_pain
  label: 感染风险因素伴休息/夜间痛或发热
  when: facts.infection_risk.any(['steroid_or_immunosuppressant','diabetes','recent_infection','recent_spinal_procedure','iv_drug']) and (facts.rest_or_night_worst.present or facts.fever.present)
  severity: same_day
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核）
  clinical_review_required: true
- id: rf_fracture_risk
  label: 外伤伴骨折风险因素
  when: facts.trauma_recent.present and (facts.age_band.any(['50_69','70_plus']) or facts.osteoporosis_or_fragility.present or facts.infection_risk.has('steroid_or_immunosuppressant'))
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到近期有外伤，并且有骨折的风险因素。请今天内联系门诊安排评估。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_trauma_severe
  label: 外伤后明显疼痛
  when: facts.trauma_recent.present and facts.severity_now.gte(7)
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到近期有外伤且疼痛明显。请今天内联系门诊说明情况。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_cancer_with_features
  label: 肿瘤史伴需留意特征
  when: facts.cancer_history.present and (facts.weight_loss.present or facts.rest_or_night_worst.present or facts.night_pain.present or facts.age_band.any(['50_69','70_plus']) or facts.course.value == 'worsening')
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到有肿瘤病史并伴有需要留意的情况。请今天内联系门诊，医生会尽快安排评估。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_weight_loss_or_cancer
  label: 体重下降 / 肿瘤病史 / 休息夜间痛
  when: facts.weight_loss.present or facts.cancer_history.present or facts.night_pain.present or facts.rest_or_night_worst.present
  severity: routine
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核）
  clinical_review_required: true
- id: rf_inflammatory_pattern
  label: 炎性腰背痛线索
  when: facts.age_band.any(['18_49']) and facts.onset_timing.value == 'over_12_weeks' and ((facts.morning_stiffness_30min.present and facts.improves_with_activity.present) or (facts.morning_stiffness_30min.present
    and facts.night_waking_second_half.present) or (facts.improves_with_activity.present and facts.night_waking_second_half.present) or facts.buttock_alternating.present)
  severity: routine
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核：考虑脊柱关节炎评估路径，NICE NG65）
  clinical_review_required: true
- id: rf_thoracic
  label: 胸段为主
  when: facts.thoracic_pain.present
  severity: routine
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核）
  clinical_review_required: true
- id: rf_out_of_scope
  label: 不在适用范围
  when: facts.age_band.value == 'under_18' or facts.pregnancy_status.value == 'yes'
  severity: routine
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 根据你的回答，这个工具目前不适合你的情况（例如未满 18 岁、怀孕或产后不久）。这不是对病情的判断。请直接联系门诊预约，或按上方紧急提示就医。（AI 草案，待临床审核）
  clinical_review_required: true
- id: rf_uncertain_red_flag
  label: 关键红旗表达不确定
  when: facts.bladder_change.uncertain or facts.bowel_change.uncertain or facts.saddle_numbness.uncertain or facts.bilateral_leg_symptoms.uncertain or facts.leg_weakness.uncertain or facts.bladder_bowel_change.uncertain
  severity: same_day
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核：患者对关键问题表达不确定，需人工确认）
  clinical_review_required: true
- id: rf_no_improvement
  label: 病程超过 6 周且加重
  when: facts.onset_timing.any(['weeks_6_to_12','over_12_weeks']) and facts.course.value == 'worsening'
  severity: routine
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核）
  clinical_review_required: true
scope_guard:
  forbidden_patterns:
  - 诊断为|确诊|你得了|你患有|你是.*(症|病)
  - 椎间盘突出|腰肌劳损|坐骨神经痛|腰椎管狭窄|强直性脊柱炎
  - 服用|口服|每日\d+次|每天\d+次|\d+\s*(mg|毫克)|布洛芬|对乙酰氨基酚|双氯芬酸|塞来昔布
  - 建议你(吃|用|贴)|开药|处方
  - 考虑.*(突出|狭窄|滑脱|骨折|肿瘤|感染)|建议.*(CT|MRI|核磁|拍片|X线)
  allowed_content_ids: []
