protocol_id: lbp_adult_v0.2_ai_draft
version: 0.2.0-ai
status: draft
title: 成年腰背痛 · 就诊前采集与诊后随访（AI 模拟临床填写草案）
specialty: 康复科 / 疼痛科 / 骨科门诊（待临床队友确认）
language: zh-CN
owners:
  clinical_lead: 待填写（本草案由 AI 依据公开指南起草，见 protocols/review/医生工作表_AI模拟填写_v1.md）
  clinical_reviewer: 待填写：第二位独立临床复核者
  engineering: 李子清
review:
  last_reviewed: null
  next_review: null
  sources:
  - NICE NG59 (2016, upd. 2020-12)
  - Finucane et al. JOSPT 2020 International Framework for Red Flags
  - GIRFT National Suspected CES Pathway 2023
  - Hartvigsen et al. Lancet 2018;391:2356
  - 中国慢性腰背痛诊疗指南（2024版）中华疼痛学杂志 2024;20(1)
  - 中国非特异性腰背痛临床诊疗指南 2022
  - NICE NG65 (2017)
  - NHS Back pain patient information
  - Menezes Costa CMAJ 2012
  - GIRFT/MACP CES warning card
scope:
  setting: 小型康复/疼痛/全科门诊。就诊前：门诊邀请患者在就诊前 1–3 天填写；诊后：医生评估并纳入随访后使用。线上只做信息采集与整理，不做分诊替代、不做诊疗。
  service_hours: 工作日 9:00–17:30 当班护士/助理查看队列；医生每日两次核对；非工作时间提交次工作日处理；紧急提示全程显示（按门诊实际修改）
  inclusion:
  - 年满 18 岁
  - 本次主诉为腰背部疼痛/不适（肋缘以下、臀横纹以上），伴或不伴臀腿部疼痛麻木
  - 已由本门诊邀请（有邀请码/患者编号）
  - 本人填写，或家属协助但本人在场并确认
  exclusion:
  - 未满 18 岁（16–17 岁是否纳入待临床决定）
  - 妊娠期或产后 6 周内（待临床确认）
  - 重大外伤后首次就诊——直接急诊
  - 已知脊柱肿瘤、感染、新鲜骨折或术后早期在治疗中（待临床确认）
  - 他人代填且本人无法确认
  - 开始页已出现紧急症状者
  service_notice: 这个工具帮助你在见医生之前，把腰背不舒服的情况说清楚，并整理给门诊医生核对。它不做诊断，不提供治疗或用药建议，也不能代替医生看病。你填写的内容会由门诊医生在工作时间查看；非工作时间提交的，医生会在下一个工作日看到。如果情况紧急，请不要等待，按页面上方的提示立即就医。
  emergency_notice: 如果出现以下任何一种情况，请不要等待线上回复，立即前往就近医院急诊或拨打 120：① 新出现的排尿困难、尿不出来、尿失禁或大便失禁；② 会阴部、肛门周围或大腿内侧发麻，或擦拭时感觉异常；③ 两条腿同时出现疼痛、麻木或无力，或无力在一天天加重；④ 伴发热（38℃ 以上）或寒战；⑤ 严重外伤后出现的腰背痛；⑥ 伴胸痛、呼吸困难。（AI 草案，待临床审核）
  out_of_scope_message: 根据你的回答，这个工具目前不适合你的情况（例如未满 18 岁、怀孕或产后不久、严重外伤后）。这不是对病情的判断。请直接联系门诊预约，或按上方紧急提示就医。你已填写的内容不会被用作医疗记录。
  contact_label: 门诊电话
  contact_phone: null
  emergency_phone: '120'
max_questions: 20
