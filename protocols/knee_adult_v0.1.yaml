# =====================================================================
# 体迹 AI · 临床协议：成年膝痛 · 就诊前采集 + 诊后随访（第二专科复用示范 v0.1）
# ---------------------------------------------------------------------
# 状态：draft —— AI 依据公开资料起草，用来证明"同一套引擎、界面、评测不改代码就能接入第二个专科"。
# 参考（待临床核对原文）：NICE CKS Knee pain – assessment（红旗：疑似化脓性关节炎、骨折、DVT、肿瘤、炎性关节病）；
#   Ottawa 膝关节规则（Stiell 1996：≥55 岁、孤立髌骨压痛、腓骨头压痛、不能屈曲到 90°、伤后与就诊时都走不了 4 步）。
# 每一条 clinical_review_required: true 的内容都必须由临床人员审核；不得用于真实用户。
# =====================================================================
protocol_id: knee_adult_v0.1
version: "0.1.0"
status: draft
title: 成年膝痛 · 就诊前症状采集与诊后随访（复用示范）
specialty: 骨科 / 康复科 / 运动医学门诊（待临床确认）
language: zh-CN
owners:
  clinical_lead: "待填写"
  clinical_reviewer: "待填写"
  engineering: "李子清"
review:
  last_reviewed: null
  next_review: null
  sources:
    - "NICE CKS: Knee pain - assessment（待临床核对原文）"
    - "Stiell IG et al. Derivation of a decision rule for the use of radiography in acute knee injuries. Ann Emerg Med 1995 / JAMA 1996（Ottawa knee rule）"

scope:
  setting: "小型骨科 / 康复 / 运动医学门诊，患者在就诊前自行填写；诊后由门诊邀请进入随访"
  service_hours: "工作日 9:00–17:30（示例，按门诊实际填写）"
  inclusion: ["18 岁及以上", "本次主诉为膝关节疼痛或不适", "已由门诊邀请使用"]
  exclusion: ["未满 18 岁", "重大外伤后首次就诊——直接急诊", "膝关节术后 6 周内——联系手术医生（待临床确认）", "他人代填且本人无法确认内容"]
  service_notice: >-
    这个工具帮助你在见医生之前，把膝盖不舒服的情况说清楚，并整理给门诊医生核对。它不做诊断，不提供治疗或用药建议。
    非工作时间提交的内容，医生会在下一个工作日查看。
  emergency_notice: >-
    如果出现以下任何一种情况，请不要等待线上回复，立即前往就近医院急诊或拨打 120：
    膝盖突然红肿发热并伴发烧或寒战；外伤后完全不能负重（走不了 4 步）或关节明显变形；
    小腿突然肿胀、发热、疼痛，或伴胸痛、气短；膝盖以下发凉、发白或明显麻木无力。（AI 草案，待临床审核）
  out_of_scope_message: 根据你的回答，这个工具目前不适用于你的情况。请直接联系门诊预约或说明情况。
  contact_label: 演示门诊
  contact_phone: "0755-00000000"   # 演示占位号码（不可拨通）；真实部署由门诊填写
  eligibility:
    - id: adult
      text: 我已年满 18 岁
      if_not: 这个工具目前只适用于 18 岁及以上的成年人。请由家长直接联系门诊；如有紧急情况请拨打 120。
  emergency_phone: "120"

max_questions: 16

body_map:
  regions_fact_key: pain_regions
  side_fact_key: pain_side
  radiation_fact_key: null
  initial_view: front
  regions_of_interest: [knee_left_front, knee_right_front, knee_left_back, knee_right_back, shin_left, shin_right, calf_left, calf_right, thigh_left_front, thigh_right_front]

facts:
  - key: pain_regions
    label: 疼痛部位
    record_label: 疼痛部位   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: body_regions
    category: location
    required: true
    critical: true
    options:
      - {value: knee_left_front,  label: 左膝（前）, synonyms: [左膝盖, 左边膝盖, 左膝前面, 左边髌骨]}
      - {value: knee_right_front, label: 右膝（前）, synonyms: [右膝盖, 右边膝盖, 右膝前面, 右边髌骨]}
      - {value: knee_left_back,   label: 左腘窝,     synonyms: [左膝后面, 左腿弯, 左膝窝]}
      - {value: knee_right_back,  label: 右腘窝,     synonyms: [右膝后面, 右腿弯, 右膝窝]}
  - key: pain_side
    label: 主要在哪一侧
    record_label: 侧别   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: location
    required: true
    critical: true
    options:
      - {value: left,  label: 左侧, synonyms: [左膝, 左边, 左腿]}
      - {value: right, label: 右侧, synonyms: [右膝, 右边, 右腿]}
      - {value: both,  label: 两侧, synonyms: [两个膝盖, 双膝, 两边膝盖]}
  - key: onset_timing
    label: 这次不舒服开始多久了
    record_label: 病程   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: onset
    required: true
    critical: true
    lexicon: {context_terms: [膝, 疼, 痛, 肿, 不舒服]}
    options:
      - {value: within_3_days, label: 3 天以内,    synonyms: [今天, 昨天, 前天, 前两天, 这两天, 刚刚]}
      - {value: days_4_to_14,  label: 4 天到 2 周, synonyms: [这几天, 一周, 一个星期, 一个礼拜, 十来天]}
      - {value: weeks_2_to_6,  label: 2 到 6 周,   synonyms: [两三周, 一个月, 一个多月]}
      - {value: weeks_6_to_12, label: 6 到 12 周,  synonyms: [两个月, 两三个月]}
      - {value: over_12_weeks, label: 超过 3 个月, synonyms: [半年, 一年, 好几年, 老毛病]}
  - key: onset_mode
    label: 起病方式
    record_label: 起病方式   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: onset
    required: true
    options:
      - {value: sudden,  label: 突然出现, synonyms: [突然, 一下子]}
      - {value: gradual, label: 慢慢出现, synonyms: [慢慢, 逐渐, 越来越]}
  - key: trigger
    label: 出现前的诱因
    record_label: 诱因   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: onset
    required: true
    options:
      - {value: twist,      label: 扭伤,     synonyms: [扭了, 崴了, 扭到, 别了一下]}
      - {value: direct_blow, label: 撞击,    synonyms: [撞到, 磕到, 碰到]}
      - {value: fall,       label: 摔倒,     synonyms: [摔了, 摔倒, 跌倒]}
      - {value: sport,      label: 运动后,   synonyms: [打球, 跑步, 爬山, 跳]}
      - {value: none_known, label: 没有明显诱因, synonyms: [没什么原因, 莫名其妙]}
  - key: trauma_recent
    label: 近期是否有外伤
    record_label: 近期外伤   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: red_flag
    required: true
    critical: true
    lexicon: {present_terms: [扭了, 崴了, 撞到, 磕到, 摔了, 摔倒, 受伤], denied_terms: [没受伤, 没摔, 没有外伤, 没扭]}
  - key: weight_bearing
    label: 能不能正常走路负重
    record_label: 负重行走   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: red_flag
    required: true
    critical: true
    options:
      - {value: normal,        label: 能正常走,        synonyms: [走路没问题, 能正常走]}
      - {value: limping,       label: 能走但一瘸一拐,  synonyms: [一瘸一拐, 瘸着走, 跛]}
      - {value: cannot_4_steps, label: 走不了 4 步,    synonyms: [走不了路, 不能走, 没法走, 站不住, 一步都走不了]}
  - key: swelling
    label: 膝盖是否肿
    record_label: 膝关节肿胀   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: associated
    required: true
    lexicon: {present_terms: [肿了, 肿起来, 肿胀, 鼓起来], denied_terms: [不肿, 没肿]}
  - key: swelling_onset
    label: 伤后多久开始肿
    record_label: 肿胀出现时间   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: enum
    category: associated
    options:
      - {value: within_2h,  label: 伤后 2 小时内, synonyms: [马上就肿, 一下子就肿, 很快就肿]}
      - {value: after_24h,  label: 第二天才肿,    synonyms: [第二天才肿, 过了一天才肿]}
      - {value: gradual,    label: 慢慢肿起来,    synonyms: [慢慢肿]}
  - key: redness_warmth
    label: 膝盖是否发红发热
