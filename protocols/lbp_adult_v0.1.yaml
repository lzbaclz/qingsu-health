  - key: fever
    label: 是否发热
    record_label: 发热   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: red_flag
    required: true
    critical: true
    lexicon:
      present_terms: [发烧, 发热, 低烧, 高烧, 体温高]
      denied_terms: [没发烧, 不发烧, 没有发烧, 没发热]

  - key: weight_loss
    label: 近期是否体重明显下降
    record_label: 体重明显下降   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
