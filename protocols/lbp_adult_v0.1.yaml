      denied_terms: [大小便正常, 大小便都正常, 大小便没问题, 大小便都没问题, 二便正常, 小便正常, 大便正常, 大小便没事]
    notes: "红旗事实：任何 present 立即触发 rf_bladder_bowel"

  - key: saddle_numbness
    label: 会阴/肛门周围是否发麻
    record_label: 会阴/肛周麻木   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: red_flag
    required: true
    critical: true
    lexicon:
      present_terms: [会阴麻, 肛门周围麻, 骑车坐垫的地方麻, 大腿内侧麻, 私处麻, 屁股中间麻, 会阴部发麻]
