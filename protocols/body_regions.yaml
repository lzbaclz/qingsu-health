# 身体地图区域定义（前端 SVG 与后端共用的唯一来源）。
# view: front|back；side: left|right|center；group 仅用于显示分组。
# 说明：左右以患者自身为准（患者的左侧 = 正面视图的画面右侧）。
regions:
  - {id: head_front,            label: 头部（前）,     view: front, side: center, group: 头颈}
  - {id: neck_front,            label: 颈前,           view: front, side: center, group: 头颈}
  - {id: shoulder_left_front,   label: 左肩（前）,     view: front, side: left,   group: 上肢}
  - {id: shoulder_right_front,  label: 右肩（前）,     view: front, side: right,  group: 上肢}
  - {id: chest_left,            label: 左胸,           view: front, side: left,   group: 躯干}
  - {id: chest_right,           label: 右胸,           view: front, side: right,  group: 躯干}
  - {id: upper_abdomen,         label: 上腹,           view: front, side: center, group: 躯干}
  - {id: abdomen_left,          label: 左腹,           view: front, side: left,   group: 躯干}
  - {id: abdomen_right,         label: 右腹,           view: front, side: right,  group: 躯干}
  - {id: lower_abdomen,         label: 下腹,           view: front, side: center, group: 躯干}
  - {id: upper_arm_left_front,  label: 左上臂（前）,   view: front, side: left,   group: 上肢}
  - {id: upper_arm_right_front, label: 右上臂（前）,   view: front, side: right,  group: 上肢}
  - {id: forearm_left_front,    label: 左前臂（前）,   view: front, side: left,   group: 上肢}
  - {id: forearm_right_front,   label: 右前臂（前）,   view: front, side: right,  group: 上肢}
  - {id: hand_left,             label: 左手,           view: front, side: left,   group: 上肢}
  - {id: hand_right,            label: 右手,           view: front, side: right,  group: 上肢}
  - {id: hip_left_front,        label: 左髋/腹股沟,    view: front, side: left,   group: 下肢}
  - {id: hip_right_front,       label: 右髋/腹股沟,    view: front, side: right,  group: 下肢}
  - {id: thigh_left_front,      label: 左大腿（前）,   view: front, side: left,   group: 下肢}
  - {id: thigh_right_front,     label: 右大腿（前）,   view: front, side: right,  group: 下肢}
  - {id: knee_left_front,       label: 左膝（前）,     view: front, side: left,   group: 下肢}
  - {id: knee_right_front,      label: 右膝（前）,     view: front, side: right,  group: 下肢}
  - {id: shin_left,             label: 左小腿（前）,   view: front, side: left,   group: 下肢}
  - {id: shin_right,            label: 右小腿（前）,   view: front, side: right,  group: 下肢}
  - {id: foot_left_top,         label: 左足背,         view: front, side: left,   group: 下肢}
  - {id: foot_right_top,        label: 右足背,         view: front, side: right,  group: 下肢}
  - {id: head_back,             label: 头部（后）,     view: back,  side: center, group: 头颈}
  - {id: neck_back,             label: 颈后,           view: back,  side: center, group: 头颈}
  - {id: shoulder_left_back,    label: 左肩（后）,     view: back,  side: left,   group: 上肢}
  - {id: shoulder_right_back,   label: 右肩（后）,     view: back,  side: right,  group: 上肢}
  - {id: upper_back_left,       label: 左上背,         view: back,  side: left,   group: 腰背}
  - {id: upper_back_right,      label: 右上背,         view: back,  side: right,  group: 腰背}
  - {id: mid_back_left,         label: 左中背,         view: back,  side: left,   group: 腰背}
  - {id: mid_back_right,        label: 右中背,         view: back,  side: right,  group: 腰背}
  - {id: lower_back_left,       label: 左腰,           view: back,  side: left,   group: 腰背}
  - {id: lower_back_center,     label: 腰部正中,       view: back,  side: center, group: 腰背}
  - {id: lower_back_right,      label: 右腰,           view: back,  side: right,  group: 腰背}
  - {id: sacrum,                label: 骶尾部,         view: back,  side: center, group: 腰背}
  - {id: buttock_left,          label: 左臀,           view: back,  side: left,   group: 腰背}
  - {id: buttock_right,         label: 右臀,           view: back,  side: right,  group: 腰背}
  - {id: upper_arm_left_back,   label: 左上臂（后）,   view: back,  side: left,   group: 上肢}
  - {id: upper_arm_right_back,  label: 右上臂（后）,   view: back,  side: right,  group: 上肢}
  - {id: forearm_left_back,     label: 左前臂（后）,   view: back,  side: left,   group: 上肢}
  - {id: forearm_right_back,    label: 右前臂（后）,   view: back,  side: right,  group: 上肢}
  - {id: hand_left_back,        label: 左手背,         view: back,  side: left,   group: 上肢}
  - {id: hand_right_back,       label: 右手背,         view: back,  side: right,  group: 上肢}
  - {id: thigh_left_back,       label: 左大腿（后）,   view: back,  side: left,   group: 下肢}
  - {id: thigh_right_back,      label: 右大腿（后）,   view: back,  side: right,  group: 下肢}
  - {id: knee_left_back,        label: 左腘窝,         view: back,  side: left,   group: 下肢}
  - {id: knee_right_back,       label: 右腘窝,         view: back,  side: right,  group: 下肢}
  - {id: calf_left,             label: 左小腿（后）,   view: back,  side: left,   group: 下肢}
  - {id: calf_right,            label: 右小腿（后）,   view: back,  side: right,  group: 下肢}
  - {id: heel_left,             label: 左足跟,         view: back,  side: left,   group: 下肢}
  - {id: heel_right,            label: 右足跟,         view: back,  side: right,  group: 下肢}
