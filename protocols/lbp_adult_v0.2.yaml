  notes: 模拟：保留事实以接住患者主动说的话；补否认词，避免「性功能正常」被当成有。问法改为只在两条腿都有症状时问。
- key: infection_risk
  label: 以下情况是否有（激素或免疫抑制药、糖尿病、近 3 个月感染、近 3 个月腰部打针或手术）
  type: multi_enum
  category: history
  clinical_review_required: true
  required: false
  options:
  - value: steroid_or_immunosuppressant
    label: 长期用激素（如泼尼松）或免疫抑制药（如器官移植后、风湿病用药）
    synonyms:
    - 激素
    - 免疫抑制剂
    - 强的松
    - 泼尼松
    - 地塞米松
    - 甲泼尼龙
  - value: diabetes
    label: 糖尿病
    synonyms:
    - 糖尿病
    - 血糖高
  - value: recent_infection
    label: 最近 3 个月有过需要治疗的感染（如尿路感染、肺炎、皮肤化脓）
    synonyms:
    - 尿路感染
    - 肺炎
    - 化脓
    - 感染
  - value: recent_spinal_procedure
    label: 最近 3 个月腰背部打过针（如封闭）或做过手术
    synonyms:
    - 打过封闭
    - 封闭针
    - 腰上打过针
    - 腰部手术
    - 腰椎手术
  - value: none
    label: 以上都没有
    synonyms:
    - 都没有
    - 以上都没有
  notes: 模拟：删掉「静脉注射药物」——国内患者会把输液、打吊瓶当成它，误报远多于真正用毒品的人，这类情况在怀疑感染时面诊问；「近期感染」「近期腰部注射或手术」写明 3 个月并举例；去掉同义词「打针」「感冒发烧」（太泛）；改为有发热、休息痛或外伤时才问，不设必答。
- key: osteoporosis_or_fragility
  label: 是否有骨质疏松或轻微外力骨折史
  type: bool
  category: history
  clinical_review_required: true
  lexicon:
    present_terms:
    - 骨质疏松
    - 骨松
    - 骨折过
    denied_terms:
    - 没有骨质疏松
  notes: 模拟：采纳；只在有外伤时追问。「骨折过」包括车祸等暴力骨折，面诊时再分。
- key: morning_stiffness_30min
  label: 早晨僵硬是否超过 30 分钟
  type: bool
  category: inflammatory
  clinical_review_required: true
  lexicon:
    present_terms:
    - 早上僵
    - 起床僵
    - 晨僵
    denied_terms: []
  notes: 模拟：采纳；只对 18–49 岁、超过 3 个月的人问（NG65 为 45 岁前起病，年龄段只能近似）。
- key: improves_with_activity
  label: 活动后减轻、休息反而加重
  type: bool
  category: inflammatory
  clinical_review_required: true
  lexicon:
    present_terms:
    - 活动开了就好
    - 越躺越疼
    - 动一动好些
    denied_terms: []
  notes: 模拟：采纳；同上。
- key: night_waking_second_half
  label: 是否在后半夜因症状醒来
  type: bool
  category: inflammatory
  clinical_review_required: true
  notes: 模拟：采纳；同上。
- key: buttock_alternating
  label: 臀部疼痛是否左右交替
  type: bool
  category: inflammatory
  clinical_review_required: true
  notes: 模拟：采纳；同上。
- key: prior_imaging
  label: 是否做过腰部影像检查及时间
  type: text
  category: history
  clinical_review_required: true
  lexicon:
    present_terms:
    - 拍过片
    - 做过核磁
    - 做过CT
    - X光
    - MRI
    - 核磁
  notes: 模拟：采纳；帮医生避免重复检查、提醒带片子。
- key: walking_distance
  label: 因腰痛只能走很短距离
  type: bool
  category: function
  clinical_review_required: true
  lexicon:
    present_terms:
    - 走不远
    - 走一会就
    - 走不了多远
    denied_terms:
    - 能走远
  notes: 模拟：采纳；走一段就得歇是椎管狭窄的线索，排在后面。
- key: work_type
  label: 工作类型
  type: enum
  category: psychosocial
  clinical_review_required: true
  options:
  - value: sedentary
    label: 久坐为主
    synonyms:
    - 坐办公室
    - 开车
  - value: physical
    label: 体力为主
    synonyms:
    - 搬运
    - 工地
    - 体力活
  - value: mixed
    label: 两者都有
    synonyms: []
  - value: not_working
    label: 目前不工作
    synonyms:
    - 退休
    - 不上班
  notes: 模拟：拿不准——职业对康复和复工安排有用，但放进诊前问卷是否值得多一题，要看 10 人测试的负担数据和真实医生意见。
- key: fear_of_movement
  label: 是否觉得活动会伤到腰、不敢动
  type: bool
  category: psychosocial
  clinical_review_required: true
  lexicon:
    present_terms:
    - 不敢动
    - 怕动
    - 怕伤到
    denied_terms: []
  notes: 模拟：采纳；怕动、不敢动是康复最该早知道的心理因素，放第三层。正式分层需要取得 STarT Back 授权。
- key: low_mood
  label: 最近是否情绪低落、提不起兴趣（可不回答）
  type: bool
  category: psychosocial
  clinical_review_required: true
  lexicon:
    present_terms:
    - 情绪低落
    - 心情差
    - 没兴趣
    - 抑郁
    denied_terms: []
  notes: 模拟：事实保留，只接住患者主动说的话；不主动问（问题已删）——问出情绪低落却没有回应路径是风险。
- key: catastrophizing
  label: 是否觉得这腰永远好不了
  type: bool
  category: psychosocial
  clinical_review_required: true
  lexicon:
    present_terms:
    - 好不了了
    - 永远好不了
    - 废了
    denied_terms: []
  notes: 模拟：事实保留，只接住患者主动说的话；不主动问（问题已删）。
- key: fu_side_effect
  label: 按医嘱处理后是否出现不舒服（只记录）
  type: bool
  category: followup
  clinical_review_required: true
  notes: 模拟：采纳；问题提到随访第二层，并请工程加一条当天复核规则（见审核意见）。
- key: pgic
  label: 和第一次来门诊时比，整体感觉
  record_label: 自评整体变化（与首诊比）
  type: enum
  category: followup
  required: true
  critical: false
  options:
  - value: much_better
    label: 好了很多
  - value: better
    label: 好了不少
  - value: slightly_better
    label: 好了一点
  - value: same
    label: 没什么变化
  - value: slightly_worse
    label: 差了一点
  - value: worse
    label: 差了不少
  - value: much_worse
    label: 差了很多
  patient_prompt: 和第一次来门诊的时候比，你现在整体感觉怎么样？
  clinical_review_required: true
  notes: 模拟：采纳生物学组的 7 级患者整体变化印象（PGIC），替换签到里 3 级的「和上次比」。两处修改：① 参照点是首诊，不是上一次——每 2–3 天一次的疗程里「和上次比」几乎总是「差不多」，看不出累积变化；PGIC 作判读锚点也要求以开始治疗为参照；② 只认直接回答，不从原话抽取（原话里的「好多了」分不清是跟哪次比）。标签用「很多 / 不少 / 一点」三档，对称，老人一眼能分。
- key: pain_avg_7d
  label: 过去 7 天平均疼几分（0–10）
  record_label: 近 7 天平均痛
  type: scale
  category: severity
  required: false
  critical: false
  min: 0
  max: 10
  patient_prompt: 过去 7 天，腰背痛平均下来大概几分？0 是一点不疼，10 是疼得受不了。
  clinical_review_required: true
  notes: 模拟：结局指标。过去 7 天平均比「现在几分」稳，治疗后一两天的酸痛不会把曲线拉歪（仿 PEG 的疼痛题，Krebs 2009）。每次签到都问，窗口会重叠，判读只拿最近一次和基线比，不受影响。只认直接回答，抽取时跳过（「疼得要命」不等于 10 分）。首诊也要问一次作基线，见 pre_visit_baseline_questions。required 设 false：首诊还没加这道题之前，确认页不会给每个人列一条「未回答」。
- key: interference_7d
  label: 过去 7 天腰痛耽误日常的事（0–10）
  record_label: 近 7 天活动受影响
  type: scale
  category: function
  required: false
  critical: false
  min: 0
  max: 10
  patient_prompt: 过去 7 天，腰背痛耽误你做日常的事（上班、做家务、走路、出门）有多厉害？0 是一点不耽误，10 是什么都做不了。
  clinical_review_required: true
  notes: 模拟：结局指标，仿 PEG 的「影响日常活动」一题（Krebs 2009），不是验证过的中文版。不用 PEG 的「生活乐趣」题：签到只有 1 分钟，这题偏情绪，问了没有回应路径。例子里不放「睡觉」，免得和疼痛混在一起。只认直接回答，抽取时跳过。
questions:
- id: q_bladder_bowel
  fact_key: bladder_bowel_change
  type: yes_no
  priority: 3
  text: 这次腰背痛以来，大小便有没有新出现的变化？比如尿不出来、要很用力才尿得出、尿的时候感觉不到、憋不住或漏尿，或者大便憋不住、感觉不到要大便。（以前就有、一直没变的不算）
  purpose: 马尾综合征：新出现的排尿、排便变化（GIRFT 2023；中国 2024 表 2）
  tier: 1
  when: null
  stage: pre_visit
  allow_unknown: true
  allow_skip: false
  review_note: 模拟：与 AI 草案分歧——大小便合成一题人人必问：国内门诊习惯问「二便」，一题列全具体表现，任何一项「有」都走同一条紧急规则，少一题；去掉「最近两周内」，症状三周前开始的人会答「没有」，是漏诊口子；不允许跳过，可选不清楚。
- id: q_saddle
  fact_key: saddle_numbness
  type: yes_no
  priority: 5
  text: 两腿之间、肛门周围或大腿根内侧，最近有没有新出现发麻、感觉变迟钝，或者上厕所擦拭时感觉和平时不一样？
  purpose: 待临床填写
  tier: 1
  allow_skip: false
  review_note: 模拟：去掉「会阴」术语，加「新出现」和「擦拭时感觉不一样」；不允许跳过，可选不清楚。
- id: q_leg_weakness
  fact_key: leg_weakness
  type: yes_no
  priority: 7
  text: 腿或脚有没有使不上劲的情况？比如踮不起脚尖、脚尖抬不起来、上楼时腿发软。
  tier: 1
  allow_skip: false
  review_note: 模拟：用具体动作问，减少把疼得不敢用力当成没劲；必问。
- id: q_weakness_progressive
  fact_key: weakness_progressive
  type: yes_no
  priority: 8
  when: facts.leg_weakness.present or facts.leg_weakness.uncertain
  text: 这种使不上劲是不是一天比一天明显？比如脚越来越抬不起来、走路越来越容易拖脚或绊到。
  tier: 1
  allow_skip: false
  review_note: 模拟：加具体表现；腿没劲「不确定」时也追问。
- id: q_fever
  fact_key: fever
  type: yes_no
  priority: 11
  text: 这几天有没有发烧（38℃ 以上）或发冷寒战？
  tier: 1
  review_note: 模拟：采纳，必问。
- id: q_trauma
  fact_key: trauma_recent
  type: yes_no
  priority: 12
  text: 这次腰背痛开始前后，有没有摔倒、撞到或受过其他外伤（哪怕只是轻轻摔了一下）？
  tier: 1
  review_note: 模拟：「最近」不明确，改成「这次腰背痛开始前后」，并提示轻轻摔一下也算。
- id: q_onset_timing
  fact_key: onset_timing
  type: single_choice
  priority: 17
  text: 这一次腰背不舒服是从多久前开始的？（如果是老毛病，请按这一次发作算）
  tier: 2
  review_note: 模拟：采纳；「按这一次发作算」的提示很关键；第二层第一个问。
- id: q_onset_mode
  fact_key: onset_mode
  type: single_choice
  priority: 34
  text: 是突然出现的，还是慢慢出现的？
  tier: 2
  review_note: 模拟：往后放；原话里常已说清，题数紧张时让位给功能影响和患者顾虑。
- id: q_trigger
  fact_key: trigger
  type: single_choice
  priority: 35
  text: 出现之前有没有什么明显的诱因？
  tier: 2
  review_note: 模拟：往后放，理由同上。
- id: q_side
  fact_key: pain_side
  type: single_choice
  priority: 20
  text: 疼痛主要在哪一侧？
  tier: 2
  review_note: 模拟：采纳；有身体图时自动跳过。
- id: q_radiation_present
  fact_key: radiation_present
  type: yes_no
  priority: 18
  text: 疼痛有没有从腰往屁股或腿上串？
  tier: 2
  review_note: 模拟：提前到第二层第二个。
- id: q_radiation_regions
  fact_key: radiation_regions
  type: body_regions
  priority: 22
  when: facts.radiation_present.present
  text: 请在身体图上标出串到的位置。
  tier: 2
  review_note: 模拟：采纳。
- id: q_leg_numbness
  fact_key: leg_numbness
  type: yes_no
  priority: 23
  text: 腿或脚有没有发麻？
  tier: 2
  review_note: 模拟：采纳。
- id: q_severity_now
  fact_key: severity_now
  type: scale
  priority: 24
  text: 现在疼到什么程度？0 是完全不痛，10 是无法忍受。
  tier: 2
  review_note: 模拟：采纳。
  anchors:
    0: 一点都不疼
    2: 有点疼，不太碍事
    4: 挺疼，还能忍着做事
    6: 很疼，做事受影响
    8: 非常疼，很多事做不了
    10: 疼得受不了
- id: q_course
  fact_key: course
  type: single_choice
  priority: 25
  text: 最近几天整体是在好转、加重，还是差不多？
  tier: 2
  review_note: 模拟：提前；多条规则要用「在加重」。
- id: q_character
  fact_key: character
  type: multi_choice
  priority: 40
  text: 疼痛是哪种感觉？可以多选。
  tier: 2
  review_note: 模拟：放到第二层最后。
- id: q_aggravating
  fact_key: aggravating
  type: multi_choice
  priority: 36
  text: 什么情况下会更明显？可以多选。
  tier: 2
  review_note: 模拟：往后放。
- id: q_relieving
  fact_key: relieving
  type: multi_choice
  priority: 37
  text: 什么情况下会缓解一些？可以多选。
  tier: 2
  review_note: 模拟：往后放。
- id: q_function_impact
  fact_key: function_impact
  type: single_choice
  priority: 27
  text: 对你的日常活动影响有多大？
  tier: 2
  review_note: 模拟：提前；对日常生活的影响决定面诊的轻重缓急。
- id: q_sleep_affected
  fact_key: sleep_affected
  type: yes_no
  priority: 39
  text: 有没有影响睡眠？
  tier: 2
  review_note: 模拟：往后放。
- id: q_prior_episodes
  fact_key: prior_episodes
  type: yes_no
  priority: 37
  text: 以前有没有出现过类似的情况？
  tier: 3
  review_note: 模拟：采纳，第三层。
- id: q_prior_treatment
  fact_key: prior_treatment
  type: text
  priority: 38
  when: facts.prior_episodes.present
  text: 以前做过哪些检查或处理？效果如何？
  tier: 3
  review_note: 模拟：采纳，第三层。
- id: q_current_medication
  fact_key: current_medication
  type: text
  priority: 29
  text: 目前有没有在用什么药或贴剂？特别是防血栓的药（比如阿司匹林、氯吡格雷、华法林）、激素或止痛药。（只做记录，医生会核对；这里不提供用药建议）
  tier: 2
  review_note: 模拟：提到第二层；点名防血栓药、激素和止痛药——疼痛科做注射前必须知道。只记录。
- id: q_patient_concern
  fact_key: patient_concern
  type: text
  priority: 28
  allow_skip: true
  text: 你最担心的是什么？或者最希望医生帮你解决什么？
  tier: 2
  review_note: 模拟：提到第二层；患者最担心什么，是面诊最有用的一句话。
- id: q_age_band
  fact_key: age_band
  type: single_choice
  priority: 1
  text: 请选择你的年龄段。
  allow_unknown: true
  allow_skip: false
  stage: pre_visit
  tier: 1
  purpose: 范围核查；红旗阈值
  review_note: 模拟：采纳，必问；建议工程把它并进开始页的年龄确认。
- id: q_bilateral
  fact_key: bilateral_leg_symptoms
  type: yes_no
  priority: 6
  text: 是不是两条腿都有疼痛、发麻或没劲（不是只有一条腿）？
  allow_unknown: true
  allow_skip: false
  stage: pre_visit
  tier: 1
  purpose: 马尾/双侧神经根
  review_note: 模拟：「同时」容易理解成同一时刻，改成「两条腿都有」；必问，不允许跳过。
- id: q_gait
  fact_key: gait_disturbance
  type: yes_no
  priority: 9
  text: 这次腰背痛以来，走路有没有新出现不稳、拖着脚走或容易绊倒？
  allow_unknown: true
  allow_skip: true
  stage: pre_visit
  tier: 1
  purpose: 中国 2024 表 2 步态障碍
  when: facts.leg_weakness.present or facts.leg_weakness.uncertain or facts.leg_numbness.present or facts.bilateral_leg_symptoms.present or facts.bilateral_leg_symptoms.uncertain
  review_note: 模拟：加「新出现」；只在腿有症状（没劲、发麻、两条腿都有）时追问，不再人人必问。
- id: q_sexual
  fact_key: sexual_function_change
  type: yes_no
  priority: 10
  text: 这个问题可以不回答：这次腰背痛以来，性功能或性生活时的感觉，有没有新出现的变化？
  allow_unknown: true
  allow_skip: true
  stage: pre_visit
  tier: 1
  purpose: 马尾综合征（GIRFT 2023）
  when: facts.bilateral_leg_symptoms.present or facts.bilateral_leg_symptoms.uncertain
  review_note: 模拟：与 AI 草案分歧——不再人人必问；只在两条腿都有症状（或不确定）时问，此时答「有」会升为紧急；仍可不回答。
- id: q_cancer_history2
  fact_key: cancer_history
  type: yes_no
  priority: 13
  text: 你本人以前有没有得过肿瘤（癌症）？
  allow_unknown: true
  allow_skip: true
  stage: pre_visit
  tier: 1
  purpose: 脊柱转移最有用的指标（Lancet 2018）
  review_note: 模拟：加「你本人」；必问——既往肿瘤史是脊柱转移最有用的单项线索。
- id: q_weight_loss2
  fact_key: weight_loss
  type: yes_no
  priority: 14
  text: 最近几个月体重有没有不明原因地明显下降？
  allow_unknown: true
  allow_skip: true
  stage: pre_visit
