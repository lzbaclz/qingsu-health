# 红旗换说法 · 开发集 v1（rf_paraphrase_v1）
#
# ▶ 这是【开发集】，不作最终证据。
#   原句由"计算机"专家（AI 模拟人设）写成 v0（会话草稿区 rf_paraphrase_v0.yaml，42 句），
#   他看过模型的失败之后调过提示词（加了"红旗专查"一遍），所以这里的数字只能叫"开发基线"。
#   最终证据只看留出集 eval/scenarios/holdout/，规则见 eval/PREREG.md。
#   本集可以拿来调提示词、调词表、调流程。
#
# ▶ 本版由"模拟评测数据负责人"（AI 模拟人设，不是执业医师）从 v0 转写，2026-09-25。
#   句子一字未改；改的是格式、协议版本和真值。所有句子都是模拟的，不是真实患者。
#
# ▶ 格式同 stress_v1：
#   - family：红旗类别（bladder_bowel / saddle / weakness / fever / weight_loss / cancer / night_pain / negative）。
#   - truth：患者的真实情况。present 有；denied 患者明确否认；uncertain 患者自己说不准。
#     value_any 为多个可接受值；多选的 value 表示"至少包含"。
#   - traps：原话里有诱导、但不能记成"有"或"不确定"的事实。记成"没有"或者不记，都不算错。
#   - expected_alerts：按 lbp_adult_v0.2 的规则由 truth 推出（脚本用协议自己的表达式求值核过）。
#     原话层与问卷之后都应如此。
#
# ▶ 评测器作答规则（2026-09-25 起）：模拟患者被直接问到红旗时，truth 里没列的答"没有"；
#   traps 里的答"不清楚"，记为"不确定"。马尾类事实上的"不确定"会触发 rf_uncertain_red_flag。
#   因此马尾类事实（bladder_bowel_change、bladder_change、bowel_change、saddle_numbness、
#   bilateral_leg_symptoms、leg_weakness、weakness_progressive）一律不放进 traps，
#   也不在 truth 里写 unknown；这类诱导靠"原话层多出来的红旗提醒"查。
#
# ▶ 大小便三个事实的写法：
#   - 阳性：bladder_bowel_change（问卷问的那一个）必写；原话明确是小便再加 bladder_change，
#     明确是大便再加 bowel_change。只抽到其中一个也能触发 rf_bladder_bowel，主指标只看提醒。
#   - 否认：只写 bladder_bowel_change: denied。细分事实没有诊前问题，写了会造成"未问"的假关键遗漏。
#
# ▶ 相对 v0 的改动（模拟临床视角逐条核对；把握不足的写在 note 里）：
#   1. protocol_id 由 lbp_adult_v0.1 改为 lbp_adult_v0.2，事实 key 按 v0.2。
#   2. 夜间痛 5 句（RF_N1–N5）：v0.2 起，"休息或夜里痛"只在 50 岁以上才计入 rf_weight_loss_or_cancer。
#      这 5 句都没说年龄，expected_alerts 由 [rf_weight_loss_or_cancer] 改为 []。仍保留，用来查夜间痛事实抽得对不对。
#   3. RF_W5 改标为说不准："一天不如一天"没说是没劲还是更疼，腿没劲和是否加重都记 uncertain；
#      走路打晃是明确的走路不稳。期望提醒改为 [rf_gait, rf_uncertain_red_flag]。
#   4. RF_W2、RF_W3 另有明确的走路不稳（拖着地、站不稳），v0.2 按 rf_gait 当天联系，期望提醒补上。
#   5. 反例按原话定 denied 还是 unknown：
#      明说正常的记 denied（NC1、NC2、NC4、NC5、NC7）；
#      "腿有点软，没见重"记为腿没劲有、加重否认（NC3）；
#      "我妈得过……我自己没得过什么大病"记为本人否认（NC6，泛泛的否认，协议照样会直接问一遍）。
#   6. 按新作答规则，马尾类的诱导不进 traps，例如 RF_B5"撒尿没劲"里的"没劲"（会诱导记成腿没劲）。
#      它们由"多出来的红旗提醒"来查。
#
# ▶ 词表核对（脚本逐字比对 v0.2 词表、事实标签和问法）：v0 当时避开的是 v0.1 词表。
#   v0.2 补词以后，有 8 句含 v0.2 的词表词或标签用语：
#   RF_B4（控制不住）、RF_B5（没劲，出现在"撒尿没劲"里）、RF_S1（感觉不到）、RF_W1（一天比一天）、
#   RF_W3（腿软、站不稳）、RF_W4（使不上劲、踮不起）、RF_F4（三十八度）、RF_NC6（癌）。
#   所以本集的"词表认出几句"不能再当成"词表外说法"的结果。
protocol_id: lbp_adult_v0.2
