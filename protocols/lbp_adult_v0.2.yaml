    unreached_rule: 两次没接通（间隔至少 10 分钟，时间自动记）：发一条短信或微信（unreached_sms），并转医生。紧急类和当天类没联系上时不能直接结案，要由医生在 advice 里选处理意见（引擎现在允许两次后直接结案，请改）
    unreached_sms: 你好，这里是门诊。你今天填的情况需要尽快处理，我们打了两次电话没接通。请按页面上的提示尽快就医，方便时回电。（模拟临床稿）
