version: 0.2.6
status: draft
title: 成年腰背痛 · 就诊前采集与疗程随访（v0.2 候选：模拟临床负责人已决定 142/144，待真实医生复核）
specialty: 康复科 / 疼痛科 / 骨科门诊（待临床队友确认）
language: zh-CN
owners:
  clinical_lead: 模拟临床负责人（AI 医学视角，待真实医生替换）
  clinical_reviewer: 待填写
  engineering: 李子清
review:
  last_reviewed: '2026-09-25'
  next_review: null
  sources:
  - 中国慢性腰背痛诊疗指南（2024 版），中华疼痛学杂志 2024;20(1)：定义、表 2 红旗征、表 3 黄旗征、量表
  - 中国非特异性腰背痛临床诊疗指南，中国脊柱脊髓杂志 2022;32(3)：定义与分期、病史要点（红旗表为图片，原文待核对）
  - GIRFT National Suspected Cauda Equina Syndrome Pathway（英国，2023-02）：马尾综合征红旗与时限
  - Finucane LM 等，International Framework for Red Flags，JOSPT 2020;50(7)：红旗分级思路
  - Hartvigsen J 等，Lancet 2018;391:2356：定义、特异性病因比例、Panel 2
  - NICE NG59 Low back pain and sciatica in over 16s（2016，2020-12 更新）：不常规影像、自我管理（条文待核对原文）
  - NICE NG65 Spondyloarthritis in over 16s（2017）：炎性腰背痛转诊标准（条文待核对原文）
  - NHS Back pain 患者信息页：何时急诊的患者版措辞（只借鉴结构，文字按国内习惯重写）
  - East Sussex MSK MACP 马尾综合征警示卡：患者版警示措辞参考
  - Menezes Costa 等，CMAJ 2012;184(11)：急性与持续性腰痛的自然病程
  - WHO 成人慢性原发性腰痛非手术管理指南（2023-12）：以人为本、教育与保持活动
  - 国家卫健委、国家中医药局《互联网诊疗监管细则（试行）》（2022）：AI 不得替代接诊
  decided_by: simulated_clinical_lead
  real_doctor_decided: 0
  simulated_decided: 142
  total_items: 144
scope:
  setting: 小型康复/疼痛/全科门诊。就诊前：门诊邀请患者在就诊前 1–3 天填写；诊后：医生评估并纳入随访后使用。线上只做信息采集与整理，不做分诊替代、不做诊疗。
  service_hours: 开诊时间内（示例：周一至周六 8:30–17:30，以门诊实际为准）由当班护士或医助查看队列：紧急类收到提醒后 30 分钟内电话，当天类 2 小时内电话，常规类由医生每天两次核对（上午开诊前、下午停诊前）；停诊时间和节假日提交的，下一个开诊日上午优先处理；紧急提示全程显示，不依赖有人在线。（模拟临床稿，上线前按门诊实际人手改）
  inclusion:
  - 年满 18 岁
  - 本次主诉为腰背部疼痛或不适（肋缘以下、臀横纹以上），伴或不伴臀部、腿部疼痛或麻木
  - 已由本门诊邀请（有邀请码或患者编号）
  - 本人填写，或家属协助但本人在场并确认
  exclusion:
  - 未满 18 岁（16–17 岁不纳入）
  - 怀孕、可能怀孕或产后 6 周内（产褥期）
  - 严重外伤（车祸、高处坠落、重物砸伤）后尚未在医院检查过——开始页直接引导急诊；已检查过、在康复期的由门诊安排
  - 正在治疗中的脊柱肿瘤、脊柱感染、新鲜骨折，或腰椎手术后 3 个月内——门诊邀请时排除，按原治疗团队的流程随访
  - 他人代填且本人无法确认
  - 开始页已出现紧急症状者——直接显示紧急提示，不进入采集
  service_notice: 这个工具帮你在见医生之前，把腰背不舒服的情况说清楚，并整理给门诊医生核对。它不做诊断，不提供治疗或用药建议，也不能代替医生看病。你填的内容不会有人实时查看：开诊时间内门诊工作人员会查看，停诊时间提交的，下一个开诊日处理。情况紧急时请不要等回复，按页面上的紧急提示立即就医。（模拟临床稿）
  emergency_notice: 出现下面任何一种情况，请不要等线上回复，立即去附近有急诊的综合医院，或拨打 120：① 小便新出现尿不出来、要很用力才尿得出、憋不住或漏尿，或大便憋不住、感觉不到要大便；② 两腿之间、肛门周围或大腿根内侧新出现发麻、感觉变迟钝，或上厕所擦拭时感觉和平时不一样；③ 两条腿突然都没劲，或站不稳、走不了路；④ 车祸、从高处摔下、被重物砸到等严重外伤后腰背痛；⑤ 腰背痛同时发高烧、发冷打寒战，或精神明显变差；⑥
    突然出现、从来没有过的剧烈疼痛，或伴胸痛、胸闷、呼吸困难、腹痛、出冷汗、头晕要晕倒。（模拟临床稿）
  out_of_scope_message: 根据你的回答，这个工具暂时不适合你的情况（比如未满 18 岁、怀孕或刚生完孩子 6 周内、严重外伤后）。这不代表对病情的判断，请直接打电话联系门诊安排就诊。如果出现页面上列出的紧急情况，请立即去急诊。（模拟临床稿）
  contact_label: 演示门诊·占位号
  contact_phone: 0755-00000000
  emergency_phone: '120'
  eligibility:
  - id: adult
    text: 我已年满 18 岁
    no_label: 不对，还没满 18 岁
    if_not: 这个工具目前只适用于 18 岁及以上的成年人。未成年人的腰背痛需要医生直接看，请由家长陪同联系门诊；情况紧急请拨打 120。（模拟临床稿）
  - id: not_pregnant
    text: 我目前没有怀孕，也不在产后 6 周内
    no_label: 不对，正在怀孕、可能怀孕或产后 6 周内
    if_not: 怀孕期间和产后 6 周内的腰背痛需要医生直接看，这个工具暂不适用。请直接联系门诊或你的产科医生；如果腰腹痛得厉害、阴道流血或流水、发烧，请立即去急诊。（模拟临床稿）
  - id: no_major_trauma
    text: 这次腰背痛不是严重外伤引起的（如车祸、从高处摔下、被重物砸到）
    no_label: 不对，是严重外伤后开始的
    if_not: 严重外伤后的腰背痛需要先在医院检查，这个工具不适用。受伤后还没去医院检查过的，请立即去附近有急诊的综合医院，行动不便请拨打 120；已经检查过、正在康复的，请直接联系门诊安排。（模拟临床稿）
