    record_label: 膝以下发凉发白或麻木无力   # 写进病历初稿时用的短标签（工程拟，医生可改）
    type: bool
    category: red_flag
    required: true
    critical: true
    lexicon: {present_terms: [脚发凉, 脚发白, 脚麻, 小腿麻, 脚抬不起来], denied_terms: [脚不麻, 脚不凉]}
  - key: night_pain
