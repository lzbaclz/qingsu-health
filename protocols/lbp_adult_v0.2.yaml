clarifications:
- fact_key: pain_side
  text: 关于疼痛在哪一侧，你的{first_source}是「{first}」，{second_source}提到「{second}」。现在的情况是？
  options:
  - label: 两侧都有
    resolve: both
  - label: 位置变了，现在主要是「{second}」
    resolve: changed_to_second
  - label: 之前点错/说错了，应该是「{second}」
    resolve: keep_second
  - label: 后面说错了，应该是「{first}」
    resolve: keep_first
  - label: 不确定
    resolve: unknown
- fact_key: onset_timing
  text: 关于这次不舒服开始的时间，你的{first_source}是「{first}」，{second_source}提到「{second}」。如果是老毛病，请按这一次发作算。现在应以哪个为准？
  options:
  - label: 这一次是「{first}」
    resolve: keep_first
  - label: 这一次是「{second}」
    resolve: keep_second
  - label: 不确定
    resolve: unknown
red_flags:
- id: rf_bladder_bowel
  label: 大小便新变化
  when: facts.bladder_change.present or facts.bladder_bowel_change.present or facts.bowel_change.present
  severity: urgent
  action: immediate_notice_and_task
  on_trigger: stop_questioning
  task_kind: red_flag_review
  patient_message: 你提到小便或大便最近有了新变化。腰背痛时出现这种变化，需要今天就当面检查：请不要等线上回复，现在就去附近有急诊的综合医院，告诉医生「我腰痛，最近大小便有变化」。行动不便请拨打 120。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：级别、终止问询采纳 AI 草案——所有新出现的大小便变化都按急诊，不按是否 2 周内区分：患者说不准起病日子，超过 2 周的马尾症状也要当天影像评估，漏诊代价是永久失禁。改动：原话更口语，告诉患者去哪、对接诊医生说什么；问法去掉「最近两周内」。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_saddle
  label: 下身（两腿之间、肛门周围）感觉变化
  when: facts.saddle_numbness.present
  severity: urgent
  action: immediate_notice_and_task
  on_trigger: stop_questioning
  task_kind: red_flag_review
  patient_message: 你提到两腿之间、肛门周围或大腿根内侧发麻或感觉变了。腰背痛时出现这种变化，需要今天就当面检查：请不要等线上回复，现在就去附近有急诊的综合医院，告诉医生「我腰痛，最近下身发麻」。行动不便请拨打 120。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：急诊、终止问询采纳。「骑自行车坐垫接触的部位」这类说明可以用（患者普遍听得懂），但主问法用「两腿之间、肛门周围或大腿根内侧」加「擦拭时感觉不一样」更直接；标签和原话去掉「会阴」「肛周」。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_ces_sexual
  label: 性功能新变化
  when: facts.sexual_function_change.present
  severity: same_day
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核：患者提到性功能新变化，未同时报两条腿症状。请当天电话，私下再问一次大小便和下身感觉；有任何一项即按紧急处理。）（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：与 AI 草案分歧，中等把握。单独的性功能变化特异性低（疼痛本身、止痛药、原有勃起问题都会引起），按急诊终止问询会大量误报，还会让后面的大小便、下身感觉题问不到；改为当天电话、继续问询，让必问的马尾题照常问。与两条腿症状同时出现仍由 rf_ces_bilateral 按急诊处理。不给患者弹出页顶红条（手机上显示「性功能」字样有隐私问题）。若真实医生坚持按 GIRFT
    原文急诊，请至少保留「继续问询」。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_ces_bilateral
  label: 两条腿都有症状，并伴其他变化
  when: facts.bilateral_leg_symptoms.present and (facts.bladder_change.present or facts.bowel_change.present or facts.saddle_numbness.present or facts.sexual_function_change.present or facts.weakness_progressive.present)
  severity: urgent
  action: immediate_notice_and_task
  on_trigger: stop_questioning
  task_kind: red_flag_review
  patient_message: 你提到两条腿都有症状，同时还有其他需要当天检查的变化（比如腿越来越没劲、大小便或下身感觉有变化）。请不要等线上回复，现在就去附近有急诊的综合医院，告诉医生「我腰痛，两条腿都有症状」。行动不便请拨打 120。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：条件与急诊级别采纳；「上述变化」患者看不懂，原话改成具体说明；标签去掉「马尾」术语。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_bilateral_only
  label: 两条腿都有症状
  when: facts.bilateral_leg_symptoms.present and (facts.onset_timing.any(['within_3_days', 'days_4_to_14', 'weeks_2_to_6', 'weeks_6_to_12']) or facts.onset_timing.uncertain or facts.course.value == 'worsening')
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到两条腿都有疼痛、发麻或没劲。请今天内打电话联系门诊，让医生判断要不要尽快检查。如果两条腿突然都没劲、站不稳，或者出现大小便变化、下身发麻，请不要等待，立即去急诊。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：当天联系采纳（不升急诊，也不放宽到两周内专科）；与 AI 草案分歧在条件：只在这次起病 3 个月内、起病时间说不准或在加重时触发。疼痛科、康复科里双下肢症状最常见的是慢性、稳定的腰椎管狭窄老人，全部当天电话会压垮护士、也吓到患者；慢性且不在加重的照样进摘要，由面诊处理。残留风险：起病时间答「不清楚」（系统记为未回答）又没说加重的新发双侧症状会漏掉——靠必问的大小便、下身发麻题和全程紧急提示兜底，并请工程修「不清楚」的记录方式。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_progressive_weakness
  label: 腿越来越使不上劲
  when: facts.weakness_progressive.present
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到腿越来越使不上劲。请今天内打电话联系门诊，医生会判断要不要尽快检查；门诊已下班的，请今天去急诊。如果几个小时内明显加重、两条腿都没劲、站不稳，或出现大小便变化、下身发麻，请立即去急诊或拨打 120。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：与 AI 草案分歧，回到 v0.1 的当天联系，中等把握。单侧进行性无力（如足下垂加重）需要 24 小时内专科评估，不一定要急诊；自述「越来越没劲」常是疼痛导致的不敢用力。双侧进行性无力仍由 rf_ces_bilateral 按急诊处理；原话写明下班后当天去急诊、快速加重立即去；继续问询让马尾必问题照常问到。发烧伴进行性无力（硬膜外脓肿）目前只靠原话兜底，请工程支持新增一条紧急规则。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_gait
  label: 走路不稳
  when: facts.gait_disturbance.present
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到最近走路不稳、拖着脚走或容易绊倒。请今天内打电话联系门诊，让医生判断要不要尽快检查，这段时间注意防摔。如果站不稳、走不了路，或同时出现两条腿没劲、大小便变化，请立即去急诊。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：当天联系采纳；原话补防摔和升级条件。问法加「新出现」，只在腿有症状时追问。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_fever
  label: 发烧
  when: facts.fever.present
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到有发烧。腰背痛同时发烧，需要今天就去医院查清原因：请今天到医院的发热门诊或急诊就诊，并打电话告诉门诊。如果发冷打寒战、高烧不退、精神很差，或出现腿没劲、大小便变化，请立即去急诊或拨打 120。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：当天级别采纳；改动在去向——康复、疼痛门诊处理不了发烧，按国内习惯让患者今天去发热门诊或急诊，而不是「联系门诊」；寒战、精神差、伴神经症状写明立即急诊（与全程紧急提示一致）。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_infection_risk_with_pain
  label: 感染风险因素伴休息/夜间痛或发热
  when: facts.infection_risk.any(['steroid_or_immunosuppressant', 'recent_infection', 'recent_spinal_procedure']) and (facts.rest_or_night_worst.present or facts.fever.present)
  severity: same_day
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核：有感染风险因素——长期激素或免疫抑制药、近 3 个月感染、近 3 个月腰部打针或手术——并伴休息或夜间痛、或发热。请当天电话了解体温和近期情况。）（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：与 AI 草案分歧——触发条件去掉糖尿病和静脉注射药物。糖尿病在中老年腰痛患者里很常见，「糖尿病＋夜里痛」会天天触发当天电话；糖尿病＋发烧已由 rf_fever 当天处理，糖尿病＋休息痛由 50 岁以上的常规复核接住。静脉注射药物选项已删除（见事实 infection_risk）。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_fracture_risk
  label: 受伤后需要留意骨折
  when: facts.trauma_recent.present and (facts.age_band.any(['50_69','70_plus']) or facts.osteoporosis_or_fragility.present or facts.infection_risk.has('steroid_or_immunosuppressant'))
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到最近摔过或受过伤，而且年龄或骨骼情况让骨折的可能需要多留意。请今天内打电话联系门诊，让医生判断下一步怎么检查。如果疼得动不了，或出现腿麻、腿没劲、大小便变化，请直接去急诊。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：条件（外伤＋50 岁以上／骨质疏松／长期激素）与当天级别采纳；原话改口语并补升级条件。70 岁以上无外伤、突然剧痛的骨质疏松性压缩骨折没有被覆盖，交面诊，拿不准是否要单列。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_trauma_severe
  label: 受伤后疼得明显
  when: facts.trauma_recent.present and facts.severity_now.gte(7)
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到最近受过伤，现在疼得比较厉害。请今天内打电话联系门诊说明情况。如果是车祸、从高处摔下这类严重外伤，或疼得动不了、腿麻没劲、大小便有变化，请直接去急诊或拨打 120。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：条件与当天级别采纳（严重外伤已在开始页分流去急诊，这里剩下的是轻微外伤后明显疼痛）；原话补严重外伤和神经症状的升级条件。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_cancer_with_features
  label: 以前得过肿瘤，需要尽早了解
  when: facts.cancer_history.present and (facts.weight_loss.present or facts.rest_or_night_worst.present or facts.night_pain.present or facts.age_band.any(['50_69', '70_plus']) or facts.course.value ==
    'worsening' or facts.thoracic_pain.present)
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你提到以前得过肿瘤。结合你这次说的情况，医生希望尽早了解：请今天内打电话联系门诊，门诊会尽快安排。这是为了稳妥，不代表已经有了结论。如果出现腿没劲、走路不稳或大小便变化，请立即去急诊。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：当天级别采纳；条件补「胸段痛为主」（肿瘤患者的胸背痛是脊髓压迫的警示，参照 NICE 转移性脊髓压迫指南思路，原文待核对）；原话避免吓人（「不代表已经有了结论」），并补脊髓压迫的升级条件。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_weight_loss_or_cancer
  label: 体重下降 / 肿瘤史 / 50 岁以上休息或夜间痛
  when: facts.weight_loss.present or facts.cancer_history.present or ((facts.rest_or_night_worst.present or facts.night_pain.present) and facts.age_band.any(['50_69', '70_plus']))
  severity: routine
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核：不明原因体重下降、本人肿瘤史，或 50 岁以上休息时、夜里最痛。面诊时重点询问，必要时提前安排。）（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：⚠ 问题的回答——50 岁以上不升为当天联系，保持常规复核：没有神经症状时，怀疑肿瘤的处理时限是「两周内完成评估」这一级，当天电话改变不了什么（诊前患者 1–3 天内就会来面诊）；肿瘤史加任何一项特征已由 rf_cancer_with_features 当天处理。与 AI 草案分歧在条件：休息或夜间痛只在 50 岁以上才计入——年轻人单独的夜间痛特异性很低，会让常规任务泛滥、医生不再看。
- id: rf_inflammatory_pattern
  label: 炎性腰背痛线索
  when: facts.age_band.any(['18_49']) and facts.onset_timing.value == 'over_12_weeks' and ((facts.morning_stiffness_30min.present and facts.improves_with_activity.present) or (facts.morning_stiffness_30min.present
    and facts.night_waking_second_half.present) or (facts.improves_with_activity.present and facts.night_waking_second_half.present) or (facts.buttock_alternating.present and (facts.morning_stiffness_30min.present
    or facts.improves_with_activity.present or facts.night_waking_second_half.present)))
  severity: routine
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核：18–49 岁、超过 3 个月，炎性腰背痛线索中有两项及以上；可按 NICE NG65 考虑是否转风湿免疫科。）（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：常规复核采纳；条件改成严格的「四项中至少两项」——AI 草案里单独一项「臀部左右交替痛」也会触发。
- id: rf_thoracic
  label: 胸段为主
  when: facts.thoracic_pain.present
  severity: routine
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核）
  clinical_review_required: true
  review_note: 模拟：采纳常规复核、只给医生看。胸背痛伴胸痛、气短、出冷汗的急症提示已写进全程紧急提示；现在的页顶提示条不分级别都是红色，给常规情况弹红条会吓人，所以不改成给患者看。
- id: rf_out_of_scope
  label: 不在适用范围
  when: facts.age_band.value == 'under_18' or facts.pregnancy_status.value == 'yes'
  severity: routine
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 根据你的回答，这个工具暂时不适合你的情况（比如未满 18 岁、怀孕或刚生完孩子 6 周内）。这不代表对病情的判断，请直接打电话联系门诊安排就诊。如果出现页面上列出的紧急情况，请立即去急诊。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：⚠ 问题的回答——说明基本合适，改得更口语，去掉「你已填写的内容不会被用作医疗记录」这句我们兑现不了的承诺。开始页已挡住大多数人，这条只兜底文字里提到的情况。理应终止问询，但现在的终止页只有「急救电话」样式，对孕妇显示会吓人，暂保留继续问询，请工程做一个不紧急的「不适用」结束页后改成终止。
- id: rf_uncertain_red_flag
  label: 关键情况说不准，需要电话确认
  when: facts.bladder_change.uncertain or facts.bowel_change.uncertain or facts.saddle_numbness.uncertain or facts.bilateral_leg_symptoms.uncertain or facts.leg_weakness.uncertain or facts.weakness_progressive.uncertain
    or facts.bladder_bowel_change.uncertain
  severity: same_day
  action: immediate_notice_and_task
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: 你对小便、大便、下身感觉或腿的情况说得还不太确定。门诊会在开诊时间内打电话和你确认。接到电话前，如果情况变得明确或加重（比如尿不出来、憋不住、下身发麻、腿越来越没劲），请不要等电话，立即去急诊。（模拟临床稿）
  clinical_review_required: true
  review_note: 模拟：当天级别采纳，两处分歧：① 改成也给患者看——关于马尾症状说不准的人，最需要被明确告诉接下来会发生什么、什么情况不要等；② 条件加上「无力是否加重不确定」。曾考虑去掉「腿没劲不确定」（确定没劲不触发、不确定反而触发，看似不一致），复测随访场景 S039（「左腿好像有点发软，不太确定」）后保留：随访里没有「是否在加重」的追问，这条是随访中新出现无力的唯一安全网。另：患者在问题里点「不清楚」目前被记为「未回答」，这条规则接不住，需要工程修（见审核意见
    P0）。
  escalate_on_conflict: true
  conflict_patient_message: 你前后提供的情况不一致，目前尚未确认。若你现在出现本页列出的紧急情况，请不要等待线上回复，按紧急提示就医。门诊会看到需要核实的双方说法。（模拟临床稿）
- id: rf_no_improvement
  label: 病程超过 6 周且加重
  when: facts.onset_timing.any(['weeks_6_to_12','over_12_weeks']) and facts.course.value == 'worsening'
  severity: routine
  action: task_only
  on_trigger: continue
  task_kind: red_flag_review
  patient_message: （仅供医生复核）
  clinical_review_required: true
  review_note: 模拟：采纳常规复核：6 周后仍在加重需要重新评估，但不是当天的事。
scope_guard:
  forbidden_patterns:
  - 诊断为|确诊|你得了|你患有|你是.*(症|病)
  - 椎间盘突出|腰肌劳损|坐骨神经痛|腰椎管狭窄|强直性脊柱炎
  - 服用|口服|每日\d+次|每天\d+次|\d+\s*(mg|毫克)|布洛芬|对乙酰氨基酚|双氯芬酸|塞来昔布
  - 建议你(吃|用|贴)|开药|处方
  - 考虑.*(突出|狭窄|滑脱|骨折|肿瘤|感染)|建议.*(CT|MRI|核磁|拍片|X线)
  allowed_content_ids: []
education:
- id: ed_bring_records
  text: 就诊时如有既往的影像或检查报告，请一并带上，方便医生核对。
  source: 门诊流程说明（待填写）
- id: ed_followup_notice
  when: facts.fu_plan_understood.denied
  text: 你表示不太清楚医生安排的下一步。门诊工作人员会在工作时间内联系你确认。
  source: 门诊流程说明（待填写）
followup:
  default_interval_days: 7
  change_facts:
  - severity_now
  - course
  - pain_regions
  - pain_side
  - radiation_present
  - leg_numbness
  - leg_weakness
  - bladder_bowel_change
  - saddle_numbness
  - function_impact
  - sleep_affected
  - bilateral_leg_symptoms
  - gait_disturbance
  - bladder_change
  - bowel_change
  - sexual_function_change
  - rest_or_night_worst
  - pain_avg_7d
  - interference_7d
  - pgic
  questions:
  - id: q_fu_new
    fact_key: fu_new_symptom
    type: yes_no
    priority: 23
    stage: follow_up
    text: 上次来门诊以后，还有什么新情况吗？比如治疗以后哪里不舒服、吃药以后不舒服、哪里新疼了或麻了。
    tier: 2
    review_note: 模拟：点名治疗反应和药物反应——疗程里最常见的新情况就是它们；也点名「哪里新麻了」，签到不再单独问腿麻、串痛。原话照常走模型抽取和红旗专查。
    when: null
    allow_unknown: false
    allow_skip: true
    purpose: 治疗反应与其他新情况；患者自己的话
  - id: q_fu_new_desc
    fact_key: fu_new_symptom_desc
    type: text
    priority: 24
    stage: follow_up
    when: facts.fu_new_symptom.present
    text: 用一句话说说新情况（可以按键盘上的话筒直接说）。
    tier: 2
    review_note: 模拟：和上一题同一屏展开。
    extract_answer: true
    allow_unknown: false
    allow_skip: true
    purpose: 患者原话
  - id: q_ci_bladder_bowel
    fact_key: bladder_bowel_change
    type: yes_no
    text: 现在大小便有没有不对劲？比如尿不出来、要很用力才尿得出、尿的时候没感觉、憋不住或漏尿，或者大便憋不住、感觉不到要大便。（这次腰痛之前就一直这样的，不算）
    stage: follow_up
    tier: 1
    priority: 1
    when: null
    allow_unknown: true
    allow_skip: false
    purpose: 马尾综合征：大小便变化
    review_note: 模拟：问「现在」而不是「上次来门诊以后新出现」：上次签到漏报、一直没好的，这一次还能接住；这次腰痛之前就一直这样的（例如前列腺增生的老人）排除在外。代价：已经查过、仍然存在的症状每次签到都会再报一次——靠任务卡显示上次处理结果来减负，不靠压住提醒。
  - id: q_ci_saddle
    fact_key: saddle_numbness
    type: yes_no
    text: 现在两腿之间、肛门周围或大腿根内侧，有没有发麻、感觉变迟钝，或者上完厕所擦的时候感觉和平时不一样？（这次腰痛之前就一直这样的，不算）
    stage: follow_up
    tier: 1
    priority: 2
    when: null
    allow_unknown: true
    allow_skip: false
    purpose: 马尾综合征：下身感觉变化
    review_note: 模拟：理由同大小便一行；补回「擦的时候感觉不一样」——v0.2 随访版漏了这半句，首诊版有。
  - id: q_ci_leg_weakness
    fact_key: leg_weakness
    type: yes_no
    text: 上次来门诊以后，腿或脚有没有新出现使不上劲，或者比以前更没劲？比如踮不起脚尖、脚尖抬不起来、上楼腿发软。
    stage: follow_up
    tier: 1
    priority: 3
    when: null
    allow_unknown: true
    allow_skip: false
    purpose: 新出现或加重的无力：治疗前请医生复评
    review_note: 模拟：问「新出现或更没劲」而不是「有没有没劲」——坐骨神经痛的人不少首诊就有没劲，每次都答「有」，追问和提醒就每次都响。注意：签到里这个事实的意思是「变化」，变化卡不要拿它和首诊的「有没有」直接比（见备忘录 §2.3）。
  - id: q_ci_bilateral
    fact_key: bilateral_leg_symptoms
    type: yes_no
    text: 上次来门诊以后，是不是变成两条腿都疼、麻或没劲了，或者两条腿都比以前更重了？
    stage: follow_up
    tier: 1
    priority: 4
    when: null
    allow_unknown: true
    allow_skip: false
    purpose: 新出现或加重的双侧症状
    review_note: 模拟：理由同腿没劲一行。「两条腿都比以前更重」是为慢性椎管狭窄的老人留的：他们本来两条腿就有症状，加重时要能答「有」，这样再加上「越来越没劲」就会按急诊处理（rf_ces_bilateral）。
  - id: q_ci_fever
    fact_key: fever
    type: yes_no
    text: 这几天有没有发烧（38℃ 以上），或者发冷打寒战？
    stage: follow_up
    tier: 1
    priority: 5
    when: null
    allow_unknown: true
    allow_skip: false
    purpose: 感染（疗程中做过注射、针刺的尤其要问）
    review_note: 模拟：补 38℃ 界线和「发冷打寒战」，与首诊问法一致。
  - id: q_ci_fall
    fact_key: trauma_recent
    type: yes_no
    text: 上次来门诊以后，有没有摔倒、撞到或受伤？哪怕只是轻轻摔了一下。
    stage: follow_up
    tier: 1
    priority: 6
    when: null
    allow_unknown: true
    allow_skip: false
    purpose: 两次治疗之间的新外伤：上手法、牵引之前要知道
    review_note: 模拟：新加的一行。老人两次治疗之间摔一下、疼得更厉害，今天再上手法或牵引，可能压在一个新的压缩性骨折上。只问两次之间的新外伤，首诊的外伤不带过来。
  - id: q_ci_weakness_progressive
    fact_key: weakness_progressive
    type: yes_no
    text: 这种没劲是不是一天比一天明显？比如脚越来越抬不起来、走路越来越容易拖脚或绊到。
    stage: follow_up
    tier: 1
    priority: 7
    when: facts.leg_weakness.present or facts.leg_weakness.uncertain
    allow_unknown: true
    allow_skip: false
    purpose: 进行性无力
    review_note: 模拟：补上 v0.2 审核意见 P1-5 要的「随访里问是否加重」。
  - id: q_ci_severity_after_fall
    fact_key: severity_now
    type: scale
    text: 摔了以后，现在疼到几分？0 是一点不疼，10 是疼得受不了。
    stage: follow_up
    tier: 1
    priority: 8
    when: facts.trauma_recent.present
    allow_unknown: true
    allow_skip: true
    purpose: 给 rf_trauma_severe 用（外伤 + 现在 ≥7 分）
    review_note: 模拟：签到平时不问「现在几分」，只在摔过之后问。
    anchors:
      0: 一点都不疼
      2: 有点疼，不太碍事
      4: 挺疼，还能忍着做事
      6: 很疼，做事受影响
      8: 非常疼，很多事做不了
      10: 疼得受不了
  - id: q_ci_pgic
    fact_key: pgic
    type: single_choice
    text: 和第一次来门诊的时候比，你现在整体感觉怎么样？
    stage: follow_up
    tier: 2
    priority: 20
    when: null
    allow_unknown: true
    allow_skip: true
    purpose: 患者整体变化印象（PGIC），恢复轨迹的锚点
    review_note: 模拟：7 个选项竖排，每个按钮不小于 56 像素高。
  - id: q_ci_pain_avg_7d
    fact_key: pain_avg_7d
    type: scale
    text: 过去 7 天，腰背痛平均下来大概几分？0 是一点不疼，10 是疼得受不了。
    stage: follow_up
    tier: 2
    priority: 21
    when: null
    allow_unknown: true
    allow_skip: true
    purpose: 恢复轨迹：疼痛
    review_note: 模拟：竖排温度计，带文字锚点。
    anchors:
      0: 一点都不疼
      2: 有点疼，不太碍事
      4: 挺疼，还能忍着做事
      6: 很疼，做事受影响
      8: 非常疼，很多事做不了
      10: 疼得受不了
  - id: q_ci_interference_7d
    fact_key: interference_7d
    type: scale
    text: 过去 7 天，腰背痛耽误你做日常的事（上班、做家务、走路、出门）有多厉害？0 是一点不耽误，10 是什么都做不了。
    stage: follow_up
    tier: 2
    priority: 22
    when: null
    allow_unknown: true
    allow_skip: true
    purpose: 恢复轨迹：活动受影响
    review_note: 模拟：同上。
    anchors:
      0: 一点不耽误
      2: 稍微耽误一点
      4: 有些事得慢着做、少做
      6: 不少事做不了或要人帮
      8: 大部分事做不了
      10: 什么都做不了
  plain_language:
  - term: 复查
    plain: 回来再检查一次，看看恢复得怎么样
    clinical_review_required: true
  - term: 复诊
    plain: 回到门诊再看一次
    clinical_review_required: true
  - term: 随访
    plain: 按约好的时间，把最近的情况告诉医生（在手机上填写，或者门诊打电话问你）
    clinical_review_required: true
  - term: 放射痛
    plain: 疼痛从腰往屁股或腿上串
    clinical_review_required: true
  - term: 麻木
    plain: 发麻、感觉变迟钝
    clinical_review_required: true
  - term: 会阴
    plain: 两腿之间、私处到肛门这一片（骑自行车时碰到车座的地方）
    clinical_review_required: true
  - term: 核心肌群
    plain: 腰腹部深处帮着稳住腰的肌肉
    clinical_review_required: true
  - term: 急性期
    plain: 刚开始疼的这段时间
    clinical_review_required: true
  - term: 热敷
    plain: 用热毛巾或热水袋隔着一层布敷在疼的地方，别太烫
    clinical_review_required: true
  - term: 冷敷
    plain: 用毛巾包着冰袋敷在疼的地方
    clinical_review_required: true
  - term: 保守治疗
    plain: 不做手术的治疗办法
    clinical_review_required: true
  - term: 影像检查
    plain: 拍片、CT 或核磁这类检查
    clinical_review_required: true
  teachback_enabled: true
  teachback_clinical_review_required: true
